<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rozkład Jazdy GTFS</title>
    <style>
        :root {
            --primary: #1e3a8a;
            --info: #2563eb;
            --danger: #dc2626;
            --gray-text: #6b7280;
            --bg-light: #f3f4f6;
            --card-bg: #ffffff;
            --border-color: #e5e7eb;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-light);
            margin: 0;
            padding: 16px;
            color: #1f2937;
        }

        .app-container {
            max-width: 600px;
            margin: 0 auto;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background: var(--primary);
            color: #fff;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header h1 {
            margin: 0;
            font-size: 1.25rem;
        }

        .nav-tabs {
            display: flex;
            background: #e2e8f0;
            border-bottom: 1px solid var(--border-color);
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: transparent;
            font-weight: 600;
            cursor: pointer;
            color: var(--gray-text);
        }

        .tab-btn.active {
            background: var(--card-bg);
            color: var(--primary);
            border-bottom: 3px solid var(--primary);
        }

        .tab-content {
            padding: 16px;
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .dep-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .dep-row.past {
            opacity: 0.6;
            background-color: #f9fafb;
        }

        .time-box {
            text-align: right;
        }

        .time-main {
            font-weight: 700;
            font-size: 1.1rem;
        }

        .delay-info {
            font-size: 0.75rem;
        }

        .msg-box {
            padding: 24px;
            text-align: center;
            color: var(--gray-text);
        }

        .btn-back {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid #fff;
            color: #fff;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-back:hover {
            background: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <button id="back-btn" class="btn-back" style="display: none;" onclick="handleBack()">← Powrót</button>
        <h1 id="app-title">Rozkład Jazdy GTFS</h1>
    </div>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('details')">Szczegóły</button>
        <button class="tab-btn" onclick="switchTab('lines')">Linie</button>
    </div>

    <div id="details" class="tab-content active">
        <div id="details-content">
            <div class="msg-box">Wybierz kurs z listy linii, aby wyświetlić szczegóły trasy.</div>
        </div>
    </div>

    <div id="lines" class="tab-content">
        <div id="lines-content">
            <div class="msg-box">Ładowanie linii...</div>
        </div>
    </div>
</div>

<script>
    window.appState = {
        stopTimes: [],
        stopsMap: new Map(),
        backAction: null,
        currentView: null
    };

    function timeToSeconds(timeStr) {
        if (!timeStr) return 0;
        const parts = timeStr.split(':').map(Number);
        return (parts[0] || 0) * 3600 + (parts[1] || 0) * 60 + (parts[2] || 0);
    }

    function formatDelay(seconds) {
        const mins = Math.floor(seconds / 60);
        return mins > 0 ? `${mins} min` : `${seconds} s`;
    }

    function calculateArrivalDelay(tripId, stopId, scheduledSec, currentSec) {
        return 0; 
    }

    function cleanStopName(name) {
        return name ? name.replace(/^Przystanek\s+/i, '').trim() : '';
    }

    function switchTab(tabId) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
        
        const targetBtn = Array.from(document.querySelectorAll('.tab-btn')).find(b => {
            const attr = b.getAttribute('onclick');
            return attr && attr.includes(tabId);
        });
        if (targetBtn) targetBtn.classList.add('active');
        
        const targetContent = document.getElementById(tabId);
        if (targetContent) targetContent.classList.add('active');
    }

    function handleBack() {
        if (window.appState.backAction) {
            window.appState.backAction();
            window.appState.backAction = null;
            document.getElementById('back-btn').style.display = 'none';
        }
    }

    function loadLineDirection(lineId, lineTitle, headsign) {
        switchTab('lines');
        document.getElementById('back-btn').style.display = 'none';
        const box = document.getElementById('lines-content');
        box.innerHTML = `
            <div style="font-weight: 700; font-size: 1.1rem; margin-bottom: 8px;">${lineTitle} &rarr; ${headsign}</div>
            <p style="font-size: 0.9rem; color: var(--gray-text);">Wybierz kurs z listy poniżej:</p>
            <div class="dep-row" style="cursor: pointer; background: #fff;" onclick="loadTripStops('TRIP_101', '${lineId}', '${headsign}')">
                <div>
                    <strong>Kurs #101</strong>
                    <div style="font-size: 0.8rem; color: var(--gray-text);">Odjazd: 12:30</div>
                </div>
                <div style="font-size: 1.2rem; font-weight: bold; color: var(--info);">&rarr;</div>
            </div>
        `;
    }

    function loadTripStops(tripId, lineId, headsign, isRefresh = false) {
        if (!isRefresh) {
            switchTab('details');
            window.appState.backAction = () => loadLineDirection(lineId, `Linia ${lineId}`, headsign);
            document.getElementById('back-btn').style.display = 'inline-block';
            window.appState.currentView = { type: 'tripStops', tripId, lineId, headsign };
        }
        const box = document.getElementById('details-content');
        if (!isRefresh) {
            box.innerHTML = `<div style="font-weight: 700; font-size: 1.1rem; margin-bottom: 4px;">Linia ${lineId} &rarr; ${headsign}</div><div class="msg-box">Ładowanie pełnej trasy kursu...</div>`;
        }

        const now = new Date();
        const currentSec = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();

        let tripStops = window.appState.stopTimes.filter(st => String(st.trip_id) === String(tripId));
        tripStops.sort((a, b) => parseInt(a.stop_sequence || 0, 10) - parseInt(b.stop_sequence || 0, 10));

        if (!tripStops.length) {
            box.innerHTML = `<div class="msg-box">Brak szczegółów przystanków dla tego kursu w bazie GTFS.</div>`;
            return;
        }

        let stopsHtml = tripStops.map((st, index) => {
            const stopName = window.appState.stopsMap.get(st.stop_id) || `Przystanek #${st.stop_id}`;
            const timeStr = st.arrival_time || st.departure_time || '';
            const timeSec = timeToSeconds(timeStr);
            const stopDelay = calculateArrivalDelay(tripId, st.stop_id, timeSec, currentSec);
            const isPast = (timeSec + stopDelay) < currentSec;

            let statusText = 'Jedzie na linii';
            let statusStyle = 'color: var(--info); font-weight: 600;';

            if (isPast) {
                if (stopDelay > 0) {
                    statusText = `Przyjechał z opóźnieniem ${formatDelay(stopDelay)}`;
                    statusStyle = 'color: var(--danger); font-weight: 600;';
                } else {
                    statusText = 'Odjechał';
                    statusStyle = 'color: var(--gray-text); font-weight: 500;';
                }
            } else if (stopDelay > 0) {
                statusText = `Opóźnienie ${formatDelay(stopDelay)}`;
                statusStyle = 'color: var(--danger); font-weight: 600;';
            }

            return `
                <div class="dep-row ${isPast ? 'past' : ''}" style="cursor: default;">
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <span style="font-weight: 700; color: ${!isPast ? 'var(--info)' : 'var(--gray-text)'}; font-size: 0.85rem; min-width: 24px;">${index + 1}.</span>
                        <div>
                            <strong style="font-size: 0.95rem; ${!isPast ? 'color: var(--info);' : ''}">${cleanStopName(stopName)}</strong>
                            <div style="font-size: 0.75rem; color: var(--gray-text);">Przystanek na trasie</div>
                        </div>
                    </div>
                    <div class="time-box">
                        <div class="time-main" style="${!isPast ? 'color: var(--info);' : ''}">${timeStr.substring(0, 5)}</div>
                        <div class="delay-info" style="${statusStyle}">
                            ${statusText}
                        </div>
                    </div>
                </div>
            `;
        }).join('');

        box.innerHTML = `
            <div style="font-weight: 700; font-size: 1.1rem; margin-bottom: 4px; border-bottom: 2px solid #000; padding-bottom: 6px;">Linia ${lineId} – Przebieg kursu</div>
            <div style="font-size: 0.85rem; color: var(--gray-text); margin-bottom: 12px;">Kierunek: <strong>${headsign}</strong></div>
            <div>${stopsHtml}</div>
        `;
    }

    document.addEventListener('DOMContentLoaded', () => {
        window.appState.stopsMap.set('1', 'Dworzec Główny');
        window.appState.stopsMap.set('2', 'Centrum');
        window.appState.stopsMap.set('3', 'Park Miejski');

        window.appState.stopTimes = [
            { trip_id: 'TRIP_101', stop_id: '1', stop_sequence: '1', departure_time: '12:30:00' },
            { trip_id: 'TRIP_101', stop_id: '2', stop_sequence: '2', departure_time: '12:35:00' },
            { trip_id: 'TRIP_101', stop_id: '3', stop_sequence: '3', departure_time: '12:42:00' }
        ];

        loadLineDirection('15', 'Linia 15', 'Park Miejski');
    });
</script>
</body>
</html>
