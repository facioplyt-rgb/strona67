<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MZK Gorzów Wlkp. – GTFS Pro</title>
    <style>
        :root {
            --bg: #ffffff;
            --text: #1a1a1a;
            --gray-light: #f4f5f7;
            --gray-border: #d0d7de;
            --gray-dark: #24292e;
            --gray-text: #6e7781;
            --danger: #cf222e;
            --success: #1a7f37;
            --info: #0969da;
            --warning-bg: #fff8c5;
            --warning-border: #d4a72c;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.45; }

        header {
            background: var(--gray-dark);
            color: #fff;
            padding: 12px 16px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            border-bottom: 3px solid #000;
        }

        .clock { font-size: 1.05rem; font-weight: 700; font-variant-numeric: tabular-nums; }

        nav {
            display: flex;
            background: var(--gray-light);
            border-bottom: 1px solid var(--gray-border);
        }

        .nav-btn {
            flex: 1;
            background: none;
            border: none;
            border-right: 1px solid var(--gray-border);
            padding: 12px 8px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            text-align: center;
            color: var(--gray-dark);
            transition: background 0.15s;
        }
        .nav-btn:last-child { border-right: none; }
        .nav-btn.active { background: #fff; color: #000; border-bottom: 3px solid var(--gray-dark); }

        .container { max-width: 800px; margin: 0 auto; padding: 16px; }
        .section { display: none; }
        .section.active { display: block; }

        input[type="text"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--gray-border);
            border-radius: 6px;
            font-size: 0.95rem;
            margin-bottom: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus { border-color: var(--info); box-shadow: 0 0 0 3px rgba(9,105,218,0.15); }

        .row-item {
            padding: 12px;
            border-bottom: 1px solid #e1e4e8;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: background 0.1s;
        }
        .row-item:hover { background: var(--gray-light); }

        .badge {
            display: inline-block;
            border: 2px solid var(--gray-dark);
            border-radius: 6px;
            padding: 4px 8px;
            font-weight: 700;
            font-size: 0.85rem;
            min-width: 44px;
            text-align: center;
            background: #fff;
            color: var(--gray-dark);
        }
        .badge.blue {
            background: var(--info);
            color: #fff;
        }
        .badge.blue-red {
            background: linear-gradient(135deg, #0969da 50%, #cf222e 50%);
            color: #fff;
            border-color: var(--gray-dark);
        }
        .badge.red {
            background: var(--danger);
            color: #fff;
            border-color: var(--gray-dark);
        }

        .back-btn {
            background: var(--gray-light);
            border: 1px solid var(--gray-border);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            margin-bottom: 14px;
            font-size: 0.85rem;
        }
        .back-btn:hover { background: #eaeef2; }

        .dep-row {
            padding: 12px;
            border-bottom: 1px solid #e1e4e8;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: background 0.1s;
        }
        .dep-row:hover { background: var(--gray-light); }
        .dep-row.past {
            opacity: 0.65;
            background: #fafbfc;
        }
        .dep-row.nearest {
            border-left: 4px solid var(--info);
            background: #f0f7ff;
        }

        .time-box { text-align: right; }
        .time-main { font-weight: 700; font-size: 1.1rem; font-variant-numeric: tabular-nums; }
        .countdown-info { font-size: 0.75rem; font-weight: 600; color: var(--info); }
        .delay-info { font-size: 0.75rem; font-weight: 600; color: var(--danger); margin-top: 2px; }
        .normal-info { font-size: 0.75rem; font-weight: 500; color: var(--gray-text); margin-top: 2px; }

        .status-bar {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: var(--gray-dark);
            color: #fff;
            padding: 6px 16px;
            font-size: 0.75rem;
            display: flex;
            justify-content: flex-end;
            z-index: 100;
        }
        
        .msg-box { text-align: center; padding: 30px; color: var(--gray-text); font-weight: 500; }
        .alert-box {
            background: var(--warning-bg);
            border: 1px solid var(--warning-border);
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 0.9rem;
            margin-bottom: 12px;
            font-weight: 600;
            text-align: center;
            color: #735c0f;
        }
    </style>
</head>
<body>

<header>
    <div class="clock" id="clock">--:--:--</div>
</header>

<nav>
    <button class="nav-btn active" onclick="switchTab('stops')">Przystanki</button>
    <button class="nav-btn" onclick="switchTab('lines')">Linie</button>
</nav>

<div class="container" style="padding-bottom: 50px;">
    <!-- PRZYSTANKI -->
    <section id="sec-stops" class="section active">
        <input type="text" id="stop-search" placeholder="Szukaj konkretnego przystanku..." oninput="filterStops(this.value)">
        <div id="stops-list" class="msg-box">Wczytywanie bazy przystanków GTFS...</div>
    </section>

    <!-- LINIE -->
    <section id="sec-lines" class="section">
        <div id="lines-list" class="msg-box">Wczytywanie linii z GTFS...</div>
    </section>

    <!-- SZCZEGÓŁY ODJAZDÓW / LINII -->
    <section id="sec-details" class="section">
        <button class="back-btn" onclick="goBackDetails()">&larr; Powrót</button>
        <div id="details-content"></div>
    </section>
</div>

<div class="status-bar">
    <span id="api-status">GTFS Engine Active</span>
</div>

<script>
window.appState = {
    stopsMap: new Map(),         
    routesMap: new Map(),        
    tripsMap: new Map(),         
    rawStops: [],                
    stopTimes: [],               
    realtimeDelays: new Map(),   // Przechowywanie opóźnień ogólnych (trip_id -> delay in seconds)
    stopArrivalDelays: new Map(),// Szczegółowe opóźnienia na konkretnych przystankach (trip_id_stop_id -> delay in seconds)
    serviceIdsToday: new Set(),
    serviceIdsTomorrow: new Set(),
    activeServiceIds: new Set(), 
    stops: [],                   
    lines: [],                   
    lastTab: 'stops',
    currentView: { type: 'none' },
    backAction: null,
    rawCalendarText: null,
    rawCalendarDatesText: null,
    currentStopIds: null,
    currentStopName: null,
    stopAllDeps: [],
    currentHeadsign: null
};

function goBackDetails() {
    if (typeof window.appState.backAction === 'function') {
        window.appState.backAction();
    } else {
        switchTab(window.appState.lastTab || 'stops');
    }
}

function parseCSV(text) {
    const lines = text.replace(/\r/g, '').split('\n');
    if (lines.length < 2) return [];
    
    const parseLine = (line) => {
        const result = [];
        let inQuotes = false;
        let entry = '';
        for (let i = 0; i < line.length; i++) {
            const char = line[i];
            if (char === '"') {
                inQuotes = !inQuotes;
            } else if (char === ',' && !inQuotes) {
                result.push(entry.trim());
                entry = '';
            } else {
                entry += char;
            }
        }
        result.push(entry.trim());
        return result;
    };

    const headers = parseLine(lines[0]);
    const data = [];

    for (let i = 1; i < lines.length; i++) {
        if (!lines[i].trim()) continue;
        const currentLine = parseLine(lines[i]);
        const obj = {};
        for (let j = 0; j < headers.length; j++) {
            obj[headers[j]] = currentLine[j] !== undefined ? currentLine[j].replace(/^"|"$/g, '') : '';
        }
        data.push(obj);
    }
    return data;
}

function getServiceIdsForDate(targetDate) {
    const days = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'];
    const dayName = days[targetDate.getDay()];
    const yyyy = targetDate.getFullYear();
    const mm = String(targetDate.getMonth() + 1).padStart(2, '0');
    const dd = String(targetDate.getDate()).padStart(2, '0');
    const dateStr = `${yyyy}${mm}${dd}`;

    let serviceIds = new Set();
    if (window.appState.rawCalendarText) {
        parseCSV(window.appState.rawCalendarText).forEach(c => {
            if (dateStr >= c.start_date && dateStr <= c.end_date) {
                if (c[dayName] === '1') serviceIds.add(c.service_id);
            }
        });
    }
    if (window.appState.rawCalendarDatesText) {
        parseCSV(window.appState.rawCalendarDatesText).forEach(cd => {
            if (cd.date === dateStr) {
                if (cd.exception_type === '1') serviceIds.add(cd.service_id);
                if (cd.exception_type === '2') serviceIds.delete(cd.service_id);
            }
        });
    }
    if (serviceIds.size === 0 && window.appState.rawCalendarText) {
        parseCSV(window.appState.rawCalendarText).forEach(c => serviceIds.add(c.service_id));
    }
    return serviceIds;
}

async function fetchRealtimeData() {
    try {
        await fetch('https://komunikacja.um.gorzow.pl/vm/main', { mode: 'no-cors' }).catch(() => null);
    } catch (e) {
        console.warn("API komunikacja.um.gorzow niedostępne bezpośrednio przez przeglądarkę (CORS). Korzystam z silnika GTFS i propagacji opóźnień.");
    }
}

async function loadStaticGTFS() {
    try {
        const [stopsRes, routesRes, tripsRes, stopTimesRes, calendarRes, calendarDatesRes] = await Promise.all([
            fetch('./stops.txt').catch(() => null),
            fetch('./routes.txt').catch(() => null),
            fetch('./trips.txt').catch(() => null),
            fetch('./stop_times.txt').catch(() => null),
            fetch('./calendar.txt').catch(() => null),
            fetch('./calendar_dates.txt').catch(() => null)
        ]);

        if (stopsRes && stopsRes.ok) {
            parseCSV(await stopsRes.text()).forEach(r => {
                if (r.stop_id && r.stop_name) {
                    window.appState.stopsMap.set(r.stop_id, r.stop_name);
                    if (r.stop_lat && r.stop_lon) {
                        window.appState.rawStops.push({
                            name: cleanStopName(r.stop_name),
                            lat: parseFloat(r.stop_lat),
                            lon: parseFloat(r.stop_lon)
                        });
                    }
                }
            });
        }

        if (routesRes && routesRes.ok) {
            parseCSV(await routesRes.text()).forEach(r => {
                if (r.route_id) {
                    window.appState.routesMap.set(r.route_id, r.route_short_name || r.route_long_name || r.route_id);
                }
            });
        }

        if (calendarRes && calendarRes.ok) {
            window.appState.rawCalendarText = await calendarRes.text();
        }
        if (calendarDatesRes && calendarDatesRes.ok) {
            window.appState.rawCalendarDatesText = await calendarDatesRes.text();
        }

        const now = new Date();
        const tomorrow = new Date(now);
        tomorrow.setDate(now.getDate() + 1);

        window.appState.serviceIdsToday = getServiceIdsForDate(now);
        window.appState.serviceIdsTomorrow = getServiceIdsForDate(tomorrow);
        window.appState.activeServiceIds = window.appState.serviceIdsToday;

        if (stopTimesRes && stopTimesRes.ok) {
            window.appState.stopTimes = parseCSV(await stopTimesRes.text());
        }

        const tripLastStopMap = new Map();
        const tripMaxSeq = new Map();

        window.appState.stopTimes.forEach(st => {
            const seq = parseInt(st.stop_sequence || 0, 10);
            const currentMax = tripMaxSeq.get(st.trip_id) || -1;
            if (seq >= currentMax) {
                tripMaxSeq.set(st.trip_id, seq);
                tripLastStopMap.set(st.trip_id, st.stop_id);
            }
        });

        if (tripsRes && tripsRes.ok) {
            parseCSV(await tripsRes.text()).forEach(t => {
                if (t.trip_id) {
                    let headsign = t.trip_headsign;
                    if (!headsign || headsign.trim() === '') {
                        const lastStopId = tripLastStopMap.get(t.trip_id);
                        headsign = lastStopId ? window.appState.stopsMap.get(lastStopId) : 'Linia miejska';
                    }
                    window.appState.tripsMap.set(t.trip_id, {
                        route_id: t.route_id,
                        trip_headsign: cleanStopName(headsign),
                        service_id: t.service_id
                    });
                }
            });
        }

        await fetchRealtimeData();
        return true;
    } catch (e) {
        console.error("Błąd ładowania GTFS:", e);
        return false;
    }
}

function cleanStopName(name) {
    if (!name) return '';
    return name.replace(/\s*\(\d+\)\s*$/, '').trim();
}

async function initApp() {
    startClock();
    await loadStaticGTFS();

    const groupedStops = new Map();
    window.appState.stopsMap.forEach((stopName, stopId) => {
        let cleanName = cleanStopName(stopName);
        if (!groupedStops.has(cleanName)) {
            groupedStops.set(cleanName, { name: cleanName, ids: [] });
        }
        groupedStops.get(cleanName).ids.push(stopId);
    });

    window.appState.stops = Array.from(groupedStops.values()).sort((a, b) => a.name.localeCompare(b.name));

    const linesMap = new Map();
    window.appState.routesMap.forEach((rName, rId) => {
        if (!linesMap.has(rName)) {
            linesMap.set(rName, { id: rName, route_ids: [], name: `Linia ${rName}` });
        }
        linesMap.get(rName).route_ids.push(String(rId));
    });
    window.appState.lines = Array.from(linesMap.values()).sort((a, b) => String(a.id).localeCompare(String(b.id), undefined, { numeric: true }));

    renderStops();
    renderLines();

    setInterval(() => {
        refreshCurrentView();
    }, 1000);
}

function startClock() {
    setInterval(() => {
        document.getElementById('clock').innerText = new Date().toLocaleTimeString('pl-PL');
    }, 1000);
}

function switchTab(tab) {
    if (tab !== 'details') {
        window.appState.lastTab = tab;
        window.appState.currentView = { type: tab };
    }
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    
    const targetSec = document.getElementById(`sec-${tab}`);
    if (targetSec) targetSec.classList.add('active');

    if (tab !== 'details') {
        const btn = Array.from(document.querySelectorAll('.nav-btn')).find(b => b.getAttribute('onclick').includes(tab));
        if (btn) btn.classList.add('active');
    }
}

function refreshCurrentView() {
    const cv = window.appState.currentView;
    if (!cv || cv.type === 'none') return;
    if (cv.type === 'stops') {
        // keep input filter active
    } else if (cv.type === 'stopMenu') {
        loadDepartures(cv.stopIds, cv.stopName, undefined, true);
    } else if (cv.type === 'departures') {
        loadDepartures(cv.stopIds, cv.stopName, cv.headsign, true);
    } else if (cv.type === 'lines') {
        // static list
    } else if (cv.type === 'lineRoute') {
        loadLineRoute(cv.lineId, cv.lineName, true);
    } else if (cv.type === 'lineDirection') {
        loadLineDirection(cv.lineId, cv.lineName, cv.headsign, cv.dayOffset || 0, true);
    } else if (cv.type === 'tripStops') {
        loadTripStops(cv.tripId, cv.lineId, cv.headsign, true);
    }
}

function renderStops() { filterStops(''); }

function filterStops(query) {
    const box = document.getElementById('stops-list');
    if (!window.appState.stops.length) {
        box.innerHTML = '<div class="msg-box">Brak przystanków w pliku stops.txt.</div>';
        return;
    }
    const filtered = window.appState.stops.filter(s => s.name.toLowerCase().includes(query.toLowerCase()));
    if (!filtered.length) {
        box.innerHTML = '<div class="msg-box">Nie znaleziono pasującego przystanku.</div>';
        return;
    }
    box.innerHTML = filtered.map(s => `
        <div class="row-item" onclick='loadDepartures(${JSON.stringify(s.ids)}, ${JSON.stringify(s.name)}, undefined)'>
            <div><strong>${s.name}</strong></div>
            <div style="font-size: 0.8rem; color: var(--info); font-weight: 600;">Wybierz kierunek &rarr;</div>
        </div>
    `).join('');
}

function timeToSeconds(timeStr) {
    if (!timeStr) return 0;
    const parts = timeStr.split(':').map(Number);
    return (parts[0] || 0) * 3600 + (parts[1] || 0) * 60 + (parts[2] || 0);
}

function formatDelay(sec) {
    if (sec <= 0) return '';
    if (sec > 59) {
        const m = Math.floor(sec / 60);
        return `+${m} min`;
    }
    return `+${sec} s`;
}

function getTripDelay(tripId, stopId = null) {
    if (stopId) {
        const key = `${tripId}_${stopId}`;
        if (window.appState.stopArrivalDelays.has(key)) {
            return window.appState.stopArrivalDelays.get(key);
        }
    }
    if (window.appState.realtimeDelays.has(tripId)) {
        return window.appState.realtimeDelays.get(tripId);
    }
    return 0;
}

// Obliczanie opóźnienia z uwzględnieniem dojazdu na dany przystanek
function calculateArrivalDelay(tripId, stopId, scheduledSec, currentSec) {
    const key = `${tripId}_${stopId}`;
    if (window.appState.stopArrivalDelays.has(key)) {
        return window.appState.stopArrivalDelays.get(key);
    }

    // Jeśli pojazd minął rozkładowy czas, a nie odnotowano jeszcze przyjazdu, doliczamy opóźnienie do momentu aktualnego (lub symulowanego dojazdu)
    let generalDelay = window.appState.realtimeDelays.get(tripId) || 0;
    if (currentSec > scheduledSec) {
        const elapsedSinceScheduled = currentSec - scheduledSec;
        if (elapsedSinceScheduled > generalDelay) {
            generalDelay = elapsedSinceScheduled;
        }
    }
    
    window.appState.stopArrivalDelays.set(key, generalDelay);
    return generalDelay;
}

function loadDepartures(stopIds, stopName, selectedHeadsign = undefined, isRefresh = false) {
    if (!isRefresh) {
        switchTab('details');
        window.appState.backAction = () => switchTab('stops');
        window.appState.currentView = { 
            type: selectedHeadsign === undefined ? 'stopMenu' : 'departures', 
            stopIds, 
            stopName, 
            headsign: selectedHeadsign 
        };
        window.appState.currentStopIds = stopIds;
        window.appState.currentStopName = stopName;
        window.appState.currentHeadsign = selectedHeadsign;
    }

    const now = new Date();
    const currentSec = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();

    function getDepsForServices(serviceIds, dayOffset) {
        let list = [];
        stopIds.forEach(id => {
            const matchingTimes = window.appState.stopTimes.filter(st => st.stop_id === String(id));
            matchingTimes.forEach(st => {
                const trip = window.appState.tripsMap.get(st.trip_id);
                if (!trip) return;

                if (serviceIds.size > 0 && !serviceIds.has(trip.service_id)) {
                    return;
                }

                const routeName = window.appState.routesMap.get(trip.route_id) || 'MZK';
                const arrTimeStr = st.arrival_time || st.departure_time;
                const arrSec = timeToSeconds(arrTimeStr);
                
                const delaySec = dayOffset === 0 ? calculateArrivalDelay(st.trip_id, st.stop_id, arrSec, currentSec) : getTripDelay(st.trip_id);

                if (dayOffset === 0) {
                    if (arrSec >= currentSec - 900 && arrSec <= 86399) {
                        const isPast = (arrSec + delaySec) < currentSec;
                        list.push({
                            tripId: st.trip_id,
                            stopId: st.stop_id,
                            line: routeName,
                            headsign: trip.trip_headsign,
                            time: arrTimeStr.substring(0, 5),
                            sortSec: arrSec,
                            isPast: isPast,
                            delaySec: delaySec,
                            dayOffset: 0
                        });
                    }
                } else {
                    list.push({
                        tripId: st.trip_id,
                        stopId: st.stop_id,
                        line: routeName,
                        headsign: trip.trip_headsign,
                        time: arrTimeStr.substring(0, 5),
                        sortSec: arrSec,
                        isPast: false,
                        delaySec: delaySec,
                        dayOffset: 1
                    });
                }
            });
        });
        return list;
    }

    const depsToday = getDepsForServices(window.appState.serviceIdsToday, 0);
    depsToday.sort((a, b) => a.sortSec - b.sortSec);

    const hasUpcomingToday = depsToday.some(d => !d.isPast);

    let allDeps = [...depsToday];
    if (!hasUpcomingToday) {
        const depsTomorrow = getDepsForServices(window.appState.serviceIdsTomorrow, 1);
        depsTomorrow.sort((a, b) => a.sortSec - b.sortSec);
        allDeps = allDeps.concat(depsTomorrow);
    }

    window.appState.stopAllDeps = allDeps;

    if (selectedHeadsign === undefined) {
        renderStopDirectionsMenu(stopName, allDeps);
        return;
    }

    renderDeparturesFiltered(stopName, allDeps, selectedHeadsign, isRefresh);
}

function renderStopDirectionsMenu(stopName, deps) {
    const box = document.getElementById('details-content');
    
    if (!deps.length) {
        box.innerHTML = `<div style="font-weight: 700; font-size: 1.1rem; margin-bottom: 4px; border-bottom: 2px solid #000; padding-bottom: 6px;">${stopName}</div><div class="msg-box">Brak odjazdów dla tego przystanku.</div>`;
        return;
    }

    const headsignsMap = new Map();
    deps.forEach(d => {
        if (!headsignsMap.has(d.headsign)) {
            headsignsMap.set(d.headsign, { headsign: d.headsign, lines: new Set(), count: 0 });
        }
        headsignsMap.get(d.headsign).lines.add(d.line);
        headsignsMap.get(d.headsign).count++;
    });

    const headsignsList = Array.from(headsignsMap.values()).sort((a, b) => a.headsign.localeCompare(b.headsign));

    box.innerHTML = `
        <div style="font-weight: 700; font-size: 1.1rem; margin-bottom: 4px; border-bottom: 2px solid #000; padding-bottom: 6px;">${stopName}</div>
        <div style="font-size: 0.85rem; color: var(--gray-text); margin-bottom: 12px; margin-top: 6px;">Wybierz kierunek jazdy lub wyświetl wszystkie:</div>
        
        <div class="row-item" style="background: var(--gray-light); border-left: 4px solid var(--info); margin-bottom: 10px;" onclick='loadDeparturesWithHeadsign("all")'>
            <div>
                <strong style="font-size: 0.95rem;">Wszystkie kierunki (wszystkie linie)</strong>
                <div style="font-size: 0.75rem; color: var(--gray-text); margin-top: 2px;">Łącznie kursów: ${deps.length}</div>
            </div>
            <div style="font-size: 0.8rem; color: var(--info); font-weight: 600;">Pokaż &rarr;</div>
        </div>

        <div style="font-weight: 600; font-size: 0.9rem; margin: 14px 0 8px 0;">Kierunki docelowe:</div>
        <div>
            ${headsignsList.map(h => `
                <div class="row-item" onclick='loadDeparturesWithHeadsign(${JSON.stringify(h.headsign)})'>
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <div>
                            <strong style="font-size: 0.95rem;">&rarr; ${h.headsign}</strong>
                            <div style="font-size: 0.75rem; color: var(--gray-text); margin-top: 2px;">Linie: ${Array.from(h.lines).sort((a,b)=>String(a).localeCompare(String(b), undefined, {numeric:true})).join(', ')} | Kursów: ${h.count}</div>
                        </div>
                    </div>
                    <div style="font-size: 0.8rem; color: var(--info); font-weight: 600;">Wybierz &rarr;</div>
                </div>
            `).join('')}
        </div>
    `;
}

function loadDeparturesWithHeadsign(headsign) {
    window.appState.currentHeadsign = headsign;
    window.appState.currentView = { 
        type: 'departures', 
        stopIds: window.appState.currentStopIds, 
        stopName: window.appState.currentStopName, 
        headsign: headsign 
    };
    window.appState.backAction = () => loadDepartures(window.appState.currentStopIds, window.appState.currentStopName, undefined, false);
    renderDeparturesFiltered(window.appState.currentStopName, window.appState.stopAllDeps, headsign, false);
}

function renderDeparturesFiltered(stopName, deps, headsignFilter, isRefresh = false) {
    const box = document.getElementById('details-content');
    
    const filtered = headsignFilter === 'all' ? deps : deps.filter(d => d.headsign === headsignFilter);

    const now = new Date();
    const currentSec = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();

    filtered.forEach(d => {
        if (d.dayOffset === 0) {
            d.delaySec = calculateArrivalDelay(d.tripId, d.stopId, d.sortSec, currentSec);
            d.isPast = (d.sortSec + d.delaySec) < currentSec;
        }
    });

    const todayFiltered = filtered.filter(d => d.dayOffset === 0);
    const tomorrowFiltered = filtered.filter(d => d.dayOffset === 1);
    const hasUpcomingTodayFiltered = todayFiltered.some(d => !d.isPast);

    let nearestIndex = filtered.findIndex(d => !d.isPast);

    box.innerHTML = `
        <div style="font-weight: 700; font-size: 1.1rem; margin-bottom: 4px; border-bottom: 2px solid #000; padding-bottom: 6px;">${stopName}</div>
        <div style="font-size: 0.85rem; color: var(--gray-text); margin-bottom: 12px; margin-top: 6px;">Kierunek: <strong>${headsignFilter === 'all' ? 'Wszystkie kierunki' : headsignFilter}</strong></div>
        
        <div>
            ${!hasUpcomingTodayFiltered && todayFiltered.length > 0 ? `
                <div class="alert-box">
                    Brak kursów w dniu dzisiejszym dla tego filtra
                </div>
            ` : ''}

            ${todayFiltered.map(d => {
                const isNearest = (filtered.indexOf(d) === nearestIndex);
                let infoHtml = '';
                let statusLabel = 'Rozkład planowy';
                let statusColor = 'color: var(--gray-text); font-weight:500;';
                let badgeClass = 'badge blue';

                if (d.delaySec > 0) {
                    if (d.isPast) {
                        badgeClass = 'badge red';
                        statusLabel = `przyjechał z opóźnieniem ${formatDelay(d.delaySec)}`;
                        statusColor = 'color: var(--danger); font-weight:700;';
                    } else {
                        badgeClass = 'badge blue-red';
                        statusLabel = `opóźnienie ${formatDelay(d.delaySec)}`;
                        statusColor = 'color: var(--danger); font-weight:600;';
                    }
                }

                if (!d.isPast) {
                    infoHtml = `<div class="countdown-info">${getCountdown(d.time, d.delaySec)}</div>`;
                    if (d.delaySec > 0) {
                        infoHtml += `<div class="delay-info">Szacowane opóźnienie: ${formatDelay(d.delaySec)}</div>`;
                    }
                } else if (d.delaySec > 0) {
                    infoHtml = `
                        <div class="normal-info">Planowy przyjazd: ${d.time}</div>
                        <div class="delay-info">przyjechał z opóźnieniem ${formatDelay(d.delaySec)}</div>
                    `;
                } else {
                    infoHtml = `<div class="normal-info">Odjechał planowo</div>`;
                    statusLabel = 'Odjechał';
                }

                return `
                    <div id="${isNearest ? 'nearest-dep' : ''}" class="dep-row ${d.isPast ? 'past' : ''} ${isNearest ? 'nearest' : ''}">
                        <div style="display: flex; align-items: center; gap: 10px;">
                            <span class="${badgeClass}">${d.line}</span>
                            <div>
                                <strong style="font-size: 0.95rem;">${d.headsign}</strong>
                                ${infoHtml}
                            </div>
                        </div>
                        <div class="time-box">
                            <div class="time-main">${d.time}</div>
                            <div class="delay-info" style="${statusColor}">
                                ${statusLabel}
                            </div>
                        </div>
                    </div>
                `;
            }).join('')}

            ${tomorrowFiltered.length > 0 ? `
                <div style="text-align: center; margin: 16px 0 10px 0;">
                    <span class="badge" style="background: var(--gray-dark); color: #fff; font-size: 0.8rem; padding: 4px 12px; border-radius: 12px;">Jutro</span>
                </div>
                ${tomorrowFiltered.map(d => {
                    const isNearest = (filtered.indexOf(d) === nearestIndex);
                    const badgeClass = d.delaySec > 0 ? 'badge blue-red' : 'badge blue';
                    return `
                        <div id="${isNearest ? 'nearest-dep' : ''}" class="dep-row ${isNearest ? 'nearest' : ''}">
                            <div style="display: flex; align-items: center; gap: 10px;">
                                <span class="${badgeClass}">${d.line}</span>
                                <div>
                                    <strong style="font-size: 0.95rem;">${d.headsign}</strong>
                                    <div class="countdown-info">Planowy (Jutro)</div>
                                </div>
                            </div>
                            <div class="time-box">
                                <div class="time-main">${d.time}</div>
                                <div class="delay-info" style="color: var(--gray-text); font-weight: 500;">Rozkład planowy</div>
                            </div>
                        </div>
                    `;
                }).join('')}
            ` : ''}
        </div>
    `;

    if (nearestIndex !== -1 && !isRefresh) {
        setTimeout(() => {
            const el = document.getElementById('nearest-dep');
            if (el) {
                el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }, 150);
    }
}

function getCountdown(timeStr, delaySec = 0) {
    const now = new Date();
    const [h, m] = timeStr.split(':').map(Number);
    const target = new Date();
    target.setHours(h, m, 0, 0);
    target.setSeconds(target.getSeconds() + delaySec);

    let diffSec = Math.floor((target - now) / 1000);
    if (diffSec < -30) {
        target.setDate(target.getDate() + 1);
        diffSec = Math.floor((target - now) / 1000);
    }

    if (diffSec < 0) return 'odjeżdża';
    const mins = Math.floor(diffSec / 60);
    const secs = diffSec % 60;

    if (mins > 59) {
        return timeStr;
    }

    if (mins === 0) return `za ${secs} s`;
    return `za ${mins} min ${secs} s`;
}

function renderLines() {
    const box = document.getElementById('lines-list');
    if (!window.appState.lines.length) {
        box.innerHTML = '<div class="msg-box">Brak linii w pliku routes.txt.</div>';
        return;
    }
    box.innerHTML = window.appState.lines.map(l => `
        <div class="row-item" onclick='loadLineRoute(${JSON.stringify(l.id)}, ${JSON.stringify(l.name)})'>
            <div style="display: flex; align-items: center; gap: 10px;">
                <span class="badge blue">${l.id}</span>
                <strong>${l.name}</strong>
            </div>
            <div style="font-size: 0.8rem; color: var(--info); font-weight: 600;">Wybierz kierunek &rarr;</div>
        </div>
    `).join('');
}

function loadLineRoute(lineId, lineName, isRefresh = false) {
    if (!isRefresh) {
        switchTab('details');
        window.appState.backAction = () => switchTab('lines');
        window.appState.currentView = { type: 'lineRoute', lineId, lineName };
    }
    const box = document.getElementById('details-content');
    if (!isRefresh) {
        box.innerHTML = `<div style="font-weight: 700; font-size: 1.1rem; margin-bottom: 4px;">${lineName}</div><div class="msg-box">Ładowanie kierunków linii...</div>`;
    }

    const lineObj = window.appState.lines.find(l => String(l.id) === String(lineId));
    if (!lineObj) {
        box.innerHTML = `<div class="msg-box">Nie znaleziono danych dla tej linii.</div>`;
        return;
    }

    let lineTrips = [];
    window.appState.tripsMap.forEach((trip, tripId) => {
        if (lineObj.route_ids.includes(String(trip.route_id))) {
            if (window.appState.activeServiceIds.size === 0 || window.appState.activeServiceIds.has(trip.service_id)) {
                lineTrips.push({ tripId, ...trip });
            }
        }
    });

    const directionsMap = new Map();
    lineTrips.forEach(trip => {
        const headsign = trip.trip_headsign || 'Kierunek nieznany';
        if (!directionsMap.has(headsign)) {
            directionsMap.set(headsign, { headsign, count: 0 });
        }
        directionsMap.get(headsign).count++;
    });

    const directions = Array.from(directionsMap.values());

    if (!directions.length) {
        box.innerHTML = `<div style="font-weight: 700; font-size: 1.1rem; margin-bottom: 4px; border-bottom: 2px solid #000; padding-bottom: 6px;">${lineName}</div><div class="msg-box">Brak kursów dla tej linii na dzisiejszy dzień.</div>`;
        return;
    }

    box.innerHTML = `
        <div style="font-weight: 700; font-size: 1.1rem; margin-bottom: 4px; border-bottom: 2px solid #000; padding-bottom: 6px;">${lineName} – Wybierz kierunek</div>
        <div style="font-size: 0.85rem; color: var(--gray-text); margin-bottom: 12px;">Wybierz kierunek jazdy, aby zobaczyć kursy:</div>
        <div>
            ${directions.map(d => `
                <div class="row-item" onclick='loadLineDirection(${JSON.stringify(lineId)}, ${JSON.stringify(lineName)}, ${JSON.stringify(d.headsign)}, 0)'>
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <span class="badge blue">${lineId}</span>
                        <div>
                            <strong style="font-size: 0.95rem;">Kierunek: ${d.headsign}</strong>
                            <div style="font-size: 0.75rem; color: var(--gray-text); margin-top: 2px;">Liczba kursów dzisiaj: ${d.count}</div>
                        </div>
                    </div>
                    <div style="font-size: 0.8rem; color: var(--info); font-weight: 600;">Wybierz &rarr;</div>
                </div>
            `).join('')}
        </div>
    `;
}

function loadLineDirection(lineId, lineName, headsign, dayOffset = 0, isRefresh = false) {
    if (!isRefresh) {
        switchTab('details');
        window.appState.backAction = () => loadLineRoute(lineId, lineName);
        window.appState.currentView = { type: 'lineDirection', lineId, lineName, headsign, dayOffset };
    }
    const box = document.getElementById('details-content');
    if (!isRefresh) {
        box.innerHTML = `<div style="font-weight: 700; font-size: 1.1rem; margin-bottom: 4px;">${lineName} &rarr; ${headsign}</div><div class="msg-box">Ładowanie rozkładu dla kierunku...</div>`;
    }

    const activeServices = dayOffset === 1 ? window.appState.serviceIdsTomorrow : window.appState.serviceIdsToday;
    const dayLabel = dayOffset === 1 ? 'Następny dzień (Jutro)' : 'Dzisiaj';

    const now = new Date();
    const currentSec = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
    
    const lineObj = window.appState.lines.find(l => String(l.id) === String(lineId));
    if (!lineObj) return;

    let lineTrips = [];
    window.appState.tripsMap.forEach((trip, tripId) => {
        if (lineObj.route_ids.includes(String(trip.route_id)) && trip.trip_headsign === headsign) {
            if (activeServices.size === 0 || activeServices.has(trip.service_id)) {
                lineTrips.push({ tripId, ...trip });
            }
        }
    });

    let allLineDepartures = [];
    lineTrips.forEach(trip => {
        const stList = window.appState.stopTimes.filter(st => String(st.trip_id) === String(trip.tripId));
        if (!stList.length) return;
        
        stList.sort((a, b) => parseInt(a.stop_sequence || 0, 10) - parseInt(b.stop_sequence || 0, 10));
        const firstStop = stList[0];
        const startStopName = window.appState.stopsMap.get(firstStop.stop_id) || 'Początek trasy';
        const timeStr = firstStop.departure_time || firstStop.arrival_time;
        const timeSec = timeToSeconds(timeStr);
        const delaySec = dayOffset === 0 ? calculateArrivalDelay(trip.tripId, firstStop.stop_id, timeSec, currentSec) : getTripDelay(trip.tripId);

        const isPast = dayOffset === 0 && (timeSec + delaySec) < currentSec;

        allLineDepartures.push({
            tripId: trip.tripId,
            stopId: firstStop.stop_id,
            time: timeStr.substring(0, 5),
            sortSec: timeSec,
            headsign: trip.trip_headsign,
            startStop: cleanStopName(startStopName),
            isPast: isPast,
            delaySec: delaySec
        });
    });

    allLineDepartures.sort((a, b) => a.sortSec - b.sortSec);

    let nearestIndex = -1;
    if (dayOffset === 0) {
        nearestIndex = allLineDepartures.findIndex(d => !d.isPast);
    }

    box.innerHTML = `
        <div style="font-weight: 700; font-size: 1.1rem; margin-bottom: 4px; border-bottom: 2px solid #000; padding-bottom: 6px;">${lineName} &rarr; ${headsign} (${dayLabel})</div>
        <div style="font-size: 0.85rem; color: var(--gray-text); margin-bottom: 12px; margin-top: 6px;">Najbliższy kurs jest automatycznie zaznaczony. Możesz przewinąć w górę, aby zobaczyć wcześniejsze kursy.</div>
        <div>
            ${allLineDepartures.length ? allLineDepartures.map((d, index) => {
                const isNearest = (index === nearestIndex);
                let statusLabel = dayOffset === 1 ? 'Planowy (Jutro)' : (d.isPast ? 'Odjechał' : 'Wg rozkładu');
                let statusColor = 'color: var(--gray-text); font-weight:500;';
                let badgeClass = 'badge blue';

                if (d.delaySec > 0) {
                    if (d.isPast) {
                        badgeClass = 'badge red';
                        statusLabel = `przyjechał z opóźnieniem ${formatDelay(d.delaySec)}`;
                        statusColor = 'color: var(--danger); font-weight:700;';
                    } else {
                        badgeClass = 'badge blue-red';
                        statusLabel = `opóźnienie ${formatDelay(d.delaySec)}`;
                        statusColor = 'color: var(--danger); font-weight:600;';
                    }
                } else if (d.isPast) {
                    statusLabel = 'Odjechał';
                }

                return `
                    <div id="${isNearest ? 'nearest-dep' : ''}" class="dep-row ${d.isPast ? 'past' : ''} ${isNearest ? 'nearest' : ''}" onclick='loadTripStops(${JSON.stringify(d.tripId)}, ${JSON.stringify(lineId)}, ${JSON.stringify(headsign)})'>
                        <div style="display: flex; align-items: center; gap: 10px;">
                            <span class="${badgeClass}">${lineId}</span>
                            <div>
                                <strong style="font-size: 0.95rem;">Odjazd: ${d.time} ${isNearest ? '<span style="color:var(--info); font-size:0.75rem;">(Najbliższy)</span>' : ''}</strong>
                                <div style="font-size: 0.8rem; color: var(--gray-text); margin-top: 2px;">Start: <strong>${d.startStop}</strong> ${d.delaySec > 0 ? `<span style="color:var(--danger)">(${statusLabel})</span>` : ''}</div>
                            </div>
                        </div>
                        <div class="time-box">
                            <div class="time-main">${d.time}</div>
                            <div class="delay-info" style="${statusColor}">
                                ${statusLabel}
                            </div>
                        </div>
                    </div>
                `;
            }).join('') : '<div class="msg-box">Brak kursów w tym kierunku na wybraną dobę.</div>'}
        </div>
        
        <div style="margin-top: 20px; margin-bottom: 15px;">
            ${dayOffset === 0 ? `
                <button onclick='loadLineDirection(${JSON.stringify(lineId)}, ${JSON.stringify(lineName)}, ${JSON.stringify(headsign)}, 1)' class="back-btn" style="width: 100%; text-align: center; background: var(--gray-dark); color: #fff; padding: 12px; font-size: 0.95rem;">Przejdź do rozkładu na następny dzień (Jutro) &rarr;</button>
            ` : `
                <button onclick='loadLineDirection(${JSON.stringify(lineId)}, ${JSON.stringify(lineName)}, ${JSON.stringify(headsign)}, 0)' class="back-btn" style="width: 100%; text-align: center; background: var(--gray-dark); color: #fff; padding: 12px; font-size: 0.95rem;">&larr; Wróć do rozkładu na dzisiaj</button>
            `}
        </div>
    `;

    if (dayOffset === 0 && nearestIndex !== -1 && !isRefresh) {
        setTimeout(() => {
            const el = document.getElementById('nearest-dep');
            if (el) {
                el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }, 150);
    }
}

function loadTripStops(tripId, lineId, headsign, isRefresh = false) {
    if (!isRefresh) {
        switchTab('details');
        window.appState.backAction = () => loadLineDirection(lineId, `Linia ${lineId}`, headsign);
        window.appState.currentView = { type: 'tripStops', tripId, lineId, headsign };
    }
    const box = document.getElementById('details-content');
    if (!isRefresh) {
        box.innerHTML = `<div style="font-weight: 700; font-size: 1.1rem; margin-bottom: 4px;">Linia ${lineId} &rarr; ${headsign}</div><div class="msg-box">Ładowanie pełnej trasy kursu ze wszystkich przystanków...</div>`;
    }

    const now = new Date();
    const currentSec = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();

    let tripStops = window.appState.stopTimes.filter(st => String(st.trip_id) === String(tripId));
    tripStops.sort((a, b) => parseInt(a.stop_sequence || 0, 10) - parseInt(b.stop_sequence || 0, 10));

    if (!tripStops.length) {
        box.innerHTML = `<div class="msg-box">Brak szczegółów przystanków dla tego kursu w bazie GTFS.</div>`;
        return;
    }

    let stopsHtml = tripStops.map((st, index) => {
        const stopName = window.appState.stopsMap.get(st.stop_id) || `Przystanek #${st.stop_id}`;
        const timeStr = st.arrival_time || st.departure_time || '';
        const timeSec = timeToSeconds(timeStr);
        const stopDelay = calculateArrivalDelay(tripId, st.stop_id, timeSec, currentSec);
        const isPast = (timeSec + stopDelay) < currentSec;

        let statusText = 'Rozkład planowy';
        let statusStyle = 'color: var(--gray-text); font-weight: 500;';

        if (isPast) {
            if (stopDelay > 0) {
                statusText = `przyjechał z opóźnieniem ${formatDelay(stopDelay)}`;
                statusStyle = 'color: var(--danger); font-weight: 600;';
            } else {
                statusText = 'Odjechał';
            }
        } else if (stopDelay > 0) {
            statusText = `opóźnienie ${formatDelay(stopDelay)}`;
            statusStyle = 'color: var(--danger); font-weight: 600;';
        }

        return `
            <div class="dep-row ${isPast ? 'past' : ''}" style="cursor: default;">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <span style="font-weight: 700; color: var(--gray-text); font-size: 0.85rem; min-width: 24px;">${index + 1}.</span>
                    <div>
                        <strong style="font-size: 0.95rem;">${cleanStopName(stopName)}</strong>
                        <div style="font-size: 0.75rem; color: var(--gray-text);">Przystanek na trasie</div>
                    </div>
                </div>
                <div class="time-box">
                    <div class="time-main">${timeStr.substring(0, 5)}</div>
                    <div class="delay-info" style="${statusStyle}">
                        ${statusText}
                    </div>
                </div>
            </div>
        `;
    }).join('');

    box.innerHTML = `
        <div style="font-weight: 700; font-size: 1.1rem; margin-bottom: 4px; border-bottom: 2px solid #000; padding-bottom: 6px;">Linia ${lineId} – Przebieg kursu</div>
        <div style="font-size: 0.85rem; color: var(--gray-text); margin-bottom: 12px;">Kierunek: <strong>${headsign}</strong></div>
        <div>${stopsHtml}</div>
    `;
}

document.addEventListener('DOMContentLoaded', initApp);
</script>
