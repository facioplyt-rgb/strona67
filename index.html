<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MZK Gorzów Wlkp. – GTFS & Live API Pro</title>
    <style>
        :root {
            --bg: #ffffff;
            --text: #1a1a1a;
            --gray-light: #f4f5f7;
            --gray-border: #d0d7de;
            --gray-dark: #24292e;
            --gray-text: #6e7781;
            --danger: #cf222e;
            --success: #1a7f37;
            --success-bg: #dafbe1;
            --info: #0969da;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.45; }

        header {
            background: var(--gray-dark);
            color: #fff;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #000;
        }

        .logo-title { font-weight: 700; font-size: 1.05rem; letter-spacing: 0.5px; text-transform: uppercase; }
        .clock { font-size: 0.95rem; font-weight: 600; font-variant-numeric: tabular-nums; }

        nav {
            display: flex;
            background: var(--gray-light);
            border-bottom: 1px solid var(--gray-border);
        }

        .nav-btn {
            flex: 1;
            background: none;
            border: none;
            border-right: 1px solid var(--gray-border);
            padding: 12px 8px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            text-align: center;
            color: var(--gray-dark);
            transition: background 0.15s;

        .nav-btn:last-child { border-right: none; }
        .nav-btn.active { background: #fff; color: #000; border-bottom: 3px solid var(--gray-dark); }

        .container { max-width: 800px; margin: 0 auto; padding: 16px; }
        .section { display: none; }
        .section.active { display: block; }

        input[type="text"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--gray-border);
            border-radius: 6px;
            font-size: 0.95rem;
            margin-bottom: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus { border-color: var(--info); box-shadow: 0 0 0 3px rgba(9,105,218,0.15); }

        .row-item {
            padding: 12px;
            border-bottom: 1px solid #e1e4e8;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: background 0.1s;
        }
        .row-item:hover { background: var(--gray-light); }

        .badge {
            display: inline-block;
            border: 2px solid var(--gray-dark);
            border-radius: 6px;
            padding: 4px 8px;
            font-weight: 700;
            font-size: 0.85rem;
            min-width: 44px;
            text-align: center;
            background: #fff;
            color: var(--gray-dark);
            cursor: pointer;
            transition: background 0.15s;
        }
        .badge:hover { background: var(--gray-light); }

        .back-btn {
            background: var(--gray-light);
            border: 1px solid var(--gray-border);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            margin-bottom: 14px;
            font-size: 0.85rem;
        }
        .back-btn:hover { background: #eaeef2; }

        .dep-row {
            padding: 12px;
            border-bottom: 1px solid #e1e4e8;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: background 0.1s;
        }
        .dep-row:hover { background: var(--gray-light); }
        .dep-row.past {
            opacity: 0.55;
            background: #fafbfc;
        }
        .dep-row.active-trip {
            background: var(--success-bg);
            border-left: 4px solid var(--success);
        }

        .time-box { text-align: right; }
        .time-main { font-weight: 700; font-size: 1.1rem; font-variant-numeric: tabular-nums; }
        .countdown-info { font-size: 0.75rem; font-weight: 600; color: var(--info); }
        
        @keyframes moveArrows {
            0% { opacity: 0.3; }
            50% { opacity: 1; }
            100% { opacity: 0.3; }

        .moving-arrows {
            font-weight: 700;
            color: var(--success);
            letter-spacing: 2px;
            animation: moveArrows 1s infinite;
        }

        .delay-info { font-size: 0.75rem; font-weight: 700; margin-top: 2px; }
        .delay-info.late { color: var(--danger); }
        .delay-info.on-time { color: var(--success); }
        .delay-info.scheduled { color: var(--gray-text); font-weight: 500; }

        .filter-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
            align-items: center;
            flex-wrap: wrap;

        .filter-bar select {
            padding: 6px 10px;
            border: 1px solid var(--gray-border);
            border-radius: 6px;
            background: #fff;
            font-size: 0.9rem;
            outline: none;
        }

        .status-bar {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: var(--gray-dark);
            color: #fff;
            padding: 6px 16px;
            font-size: 0.75rem;
            display: flex;
            justify-content: space-between;
            z-index: 100;
        }
        
        .msg-box { text-align: center; padding: 30px; color: var(--gray-text); font-weight: 500; }
    </style>

<header>
    <div class="logo-title">MZK Gorzów Wlkp. – GTFS & Live API Pro</div>
    <div class="clock" id="clock">--:--:--</div>
</header>

    <span id="status-text">Inicjalizacja systemu...</span>

<script>
const PROXY_URL = "https://shiny-tree-3a9b.fabianzukowski-32.workers.dev/"; 
const TOKEN = "iwa_live_tlv2api_b065655533f6d1b185f5d916ea359a8cd6cf7c545b7c54ae1B9Wj9";

window.appState = {
    stopsMap: new Map(),         
    routesMap: new Map(),        
    tripsMap: new Map(),         
    rawStops: [],                
    stopTimes: [],               
    activeServiceIds: new Set(), 
    vehicles: [],                
    stops: [],                   
    lines: [],                   
    lastTab: 'stops',
    currentDeps: [],
    currentStopName: '',
    currentViewType: null,       // 'stop', 'line', 'trip', 'live'
    currentViewParams: null
};

function parseCSV(text) {
    const lines = text.replace(/\r/g, '').split('\n');
    if (lines.length < 2) return [];
    
    const parseLine = (line) => {
        const result = [];
        let inQuotes = false;
        let entry = '';
        for (let i = 0; i < line.length; i++) {
            const char = line[i];
            if (char === '"') {
                inQuotes = !inQuotes;
            } else if (char === ',' && !inQuotes) {
                result.push(entry.trim());
                entry = '';
            } else {
                entry += char;
            }
        }
        result.push(entry.trim());
        return result;
    };

    const headers = parseLine(lines[0]);
    const data = [];

    for (let i = 1; i < lines.length; i++) {
        if (!lines[i].trim()) continue;
        const currentLine = parseLine(lines[i]);
        const obj = {};
        for (let j = 0; j < headers.length; j++) {
            obj[headers[j]] = currentLine[j] !== undefined ? currentLine[j].replace(/^"|"$/g, '') : '';
        }
        data.push(obj);
    }
    return data;
}

async function loadStaticGTFS() {
    try {
        const [stopsRes, routesRes, tripsRes, stopTimesRes, calendarRes, calendarDatesRes] = await Promise.all([
            fetch('./stops.txt').catch(() => null),
            fetch('./routes.txt').catch(() => null),
            fetch('./trips.txt').catch(() => null),
            fetch('./stop_times.txt').catch(() => null),
            fetch('./calendar.txt').catch(() => null),
            fetch('./calendar_dates.txt').catch(() => null)
        ]);

        if (stopsRes && stopsRes.ok) {
            parseCSV(await stopsRes.text()).forEach(r => {
                if (r.stop_id && r.stop_name) {
                    window.appState.stopsMap.set(r.stop_id, r.stop_name);
                    if (r.stop_lat && r.stop_lon) {
                        window.appState.rawStops.push({
                            id: r.stop_id,
                            name: cleanStopName(r.stop_name),
                            lat: parseFloat(r.stop_lat),
                            lon: parseFloat(r.stop_lon)
                        });
                    }
                }
            });
        }

        if (routesRes && routesRes.ok) {
            parseCSV(await routesRes.text()).forEach(r => {
                if (r.route_id) {
                    window.appState.routesMap.set(r.route_id, r.route_short_name || r.route_long_name || r.route_id);
                }
            });
        }

        const now = new Date();
        const days = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'];
        const todayDayName = days[now.getDay()];
        const yyyy = now.getFullYear();
        const mm = String(now.getMonth() + 1).padStart(2, '0');
        const dd = String(now.getDate()).padStart(2, '0');
        const todayDateStr = `${yyyy}${mm}${dd}`;

        let serviceIds = new Set();
        if (calendarRes && calendarRes.ok) {
            parseCSV(await calendarRes.text()).forEach(c => {
                if (todayDateStr >= c.start_date && todayDateStr <= c.end_date) {
                    if (c[todayDayName] === '1') serviceIds.add(c.service_id);
                }
            });
        }
        if (calendarDatesRes && calendarDatesRes.ok) {
            parseCSV(await calendarDatesRes.text()).forEach(cd => {
                if (cd.date === todayDateStr) {
                    if (cd.exception_type === '1') serviceIds.add(cd.service_id);
                    if (cd.exception_type === '2') serviceIds.delete(cd.service_id);
                }
            });
        }
        if (serviceIds.size === 0 && calendarRes) {
            parseCSV(await calendarRes.text()).forEach(c => serviceIds.add(c.service_id));
        }
        window.appState.activeServiceIds = serviceIds;

        if (stopTimesRes && stopTimesRes.ok) {
            window.appState.stopTimes = parseCSV(await stopTimesRes.text());
        }

        const tripLastStopMap = new Map();
        const tripMaxSeq = new Map();

        window.appState.stopTimes.forEach(st => {
            const seq = parseInt(st.stop_sequence || 0, 10);
            const currentMax = tripMaxSeq.get(st.trip_id) || -1;
            if (seq >= currentMax) {
                tripMaxSeq.set(st.trip_id, seq);
                tripLastStopMap.set(st.trip_id, st.stop_id);
            }
        });

        if (tripsRes && tripsRes.ok) {
            parseCSV(await tripsRes.text()).forEach(t => {
                if (t.trip_id) {
                    let headsign = t.trip_headsign;
                    if (!headsign || headsign.trim() === '') {
                        const lastStopId = tripLastStopMap.get(t.trip_id);
                        headsign = lastStopId ? window.appState.stopsMap.get(lastStopId) : 'Linia miejska';
                    }
                    window.appState.tripsMap.set(t.trip_id, {
                        route_id: t.route_id,
                        trip_headsign: cleanStopName(headsign),
                        service_id: t.service_id
                    });
                }
            });
        }

        return true;
    } catch (e) {
        console.error("Błąd ładowania GTFS:", e);
        return false;
    }
}

function cleanStopName(name) {
    if (!name) return '';
    return name.replace(/\s*\(\d+\)\s*$/, '').trim();
}

function calculateDistance(lat1, lon1, lat2, lon2) {
    const R = 6371e3; // promienie Ziemi w metrach
    const φ1 = lat1 * Math.PI/180;
    const φ2 = lat2 * Math.PI/180;
    const Δφ = (lat2-lat1) * Math.PI/180;
    const Δλ = (lon2-lon1) * Math.PI/180;

    const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
              Math.cos(φ1) * Math.cos(φ2) *
              Math.sin(Δλ/2) * Math.sin(Δλ/2);
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    return R * c;
}

function getNearestStopInfoForGPS(lat, lon) {
    if (!lat || !lon || !window.appState.rawStops.length) return { name: 'Na trasie', text: 'b/d' };
    
    let sortedStops = window.appState.rawStops.map(s => ({
        ...s,
        dist: calculateDistance(lat, lon, s.lat, s.lon)
    })).sort((a, b) => a.dist - b.dist);

    if (!sortedStops.length) return { name: 'Na trasie', text: 'b/d' };

    const closest = sortedStops[0];
    
    // Jeśli pojazd jest bardzo blisko przystanku (< 25 metrów)
    if (closest.dist < 25) {
        return { name: closest.name, segment: `Na przystanku: ${closest.name}`, text: '>>>>', isAtStop: true };
    }

    // Znajdź drugi najbliższy w rozsądnej odległości, aby określić między którymi się znajduje
    let secondClosest = sortedStops.find(s => s.name !== closest.name && s.dist < 1500) || sortedStops[1];

    let segmentText = `W pobliżu: ${closest.name}`;
    if (secondClosest && closest.dist < 800 && secondClosest.dist < 800) {
        segmentText = `Między: ${closest.name} a ${secondClosest.name}`;
    }

    // Szacowanie czasu na podstawie odległości (zakładając średnią prędkość miejską ~25 km/h = ~7 m/s)
    const speedMs = 7;
    const sec = Math.round(closest.dist / speedMs);

    let countdownStr = '';
    if (sec <= 5) {
        countdownStr = '>>>>';
    } else if (sec < 60) {
        countdownStr = `za ${sec} s`;
    } else {
        const mins = Math.ceil(sec / 60);
        countdownStr = `za ${mins} min`;
    }

    return { name: closest.name, segment: segmentText, text: countdownStr, isAtStop: false };
}

function getVehicleNextStopInfo(v) {
    const vLat = parseFloat(v.lat || v.latitude || v.y || v.gpsY || 0);
    const vLon = parseFloat(v.lon || v.longitude || v.x || v.gpsX || 0);
    return getNearestStopInfoForGPS(vLat, vLon);
}

async function fetchAPI(command, action, params = '') {
    const targetUrl = `https://komunikacja.um.gorzow.pl/vm/main?command=${command}&action=${action}&token=${TOKEN}${params}`;
    try {
        const res = await fetch(PROXY_URL + "?url=" + encodeURIComponent(targetUrl));
        if (!res.ok) return null;
        const text = await res.text();
        if (!text || text.trim().startsWith('<') || text.includes('Cloudflare')) return null;
        return JSON.parse(text);
    } catch (e) {
        console.error("Błąd API:", e);
        return null;
    }
}

async function initApp() {
    startClock();
    startAutoRefresh();
    document.getElementById('status-text').innerText = 'Ładowanie rozkładu GTFS...';
    
    await loadStaticGTFS();

    const groupedStops = new Map();
    window.appState.stopsMap.forEach((stopName, stopId) => {
        let cleanName = cleanStopName(stopName);
        if (!groupedStops.has(cleanName)) {
            groupedStops.set(cleanName, { name: cleanName, ids: [] });
        }
        groupedStops.get(cleanName).ids.push(stopId);
    });

    window.appState.stops = Array.from(groupedStops.values()).sort((a, b) => a.name.localeCompare(b.name));

    const linesMap = new Map();
    window.appState.routesMap.forEach((rName, rId) => {
        linesMap.set(rName, { id: rName, route_id: rId, name: `Linia ${rName}` });
    });
    window.appState.lines = Array.from(linesMap.values()).sort((a, b) => String(a.id).localeCompare(String(b.id), undefined, { numeric: true }));

    renderStops();
    renderLines();

    await updateLiveData();
    document.getElementById('status-text').innerText = 'Gotowy – GTFS + Live API Pro (Odświeżanie co 1s)';
}

async function updateLiveData() {
    const vehiclesData = await fetchAPI('planner', 'v');
    if (vehiclesData) {
        window.appState.vehicles = Array.isArray(vehiclesData) ? vehiclesData : (vehiclesData?.vehicles || vehiclesData?.data || []);
    }
}

function startClock() {
    setInterval(() => {
        document.getElementById('clock').innerText = new Date().toLocaleTimeString('pl-PL');
    }, 1000);
}

function startAutoRefresh() {
    // Co 1 sekundę odświeżaj widok i liczniki czasu rzeczywistego
    setInterval(async () => {
        // Okokło co 15 sekund pobierz świeże dane z GPS API
        if (Math.random() < 0.06) {
            await updateLiveData();
        }
        refreshCurrentView();
    }, 1000);
}

function refreshCurrentView() {
    const activeSec = document.querySelector('.section.active');
    if (!activeSec) return;
    
    if (activeSec.id === 'sec-live') {
        renderLive();
    } else if (activeSec.id === 'sec-details') {
        // Odśwież widok szczegółów w zależności od typu
        const type = window.appState.currentViewType;
        const p = window.appState.currentViewParams;
        if (type === 'stop') {
            loadDepartures(p.stopIds, p.stopName, true); // true = silent/refresh
        } else if (type === 'line') {
            loadLineRoute(p.lineId, p.lineName, true);
        } else if (type === 'trip') {
            loadTripStops(p.tripId, p.lineId, p.headsign, true);
        }
    }
}

function switchTab(tab) {
    if (tab !== 'details') window.appState.lastTab = tab;
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    
    const targetSec = document.getElementById(`sec-${tab}`);
    if (targetSec) targetSec.classList.add('active');

    if (tab !== 'details') {
        const btn = Array.from(document.querySelectorAll('.nav-btn')).find(b => b.getAttribute('onclick').includes(tab));
        if (btn) btn.classList.add('active');
        window.appState.currentViewType = null;
    }
}

function renderStops() { filterStops(''); }

function filterStops(query) {
    const box = document.getElementById('stops-list');
    if (!window.appState.stops.length) {
        box.innerHTML = '<div class="msg-box">Brak przystanków w pliku stops.txt.</div>';
        return;
    }
    const filtered = window.appState.stops.filter(s => s.name.toLowerCase().includes(query.toLowerCase()));
    if (!filtered.length) {
        box.innerHTML = '<div class="msg-box">Nie znaleziono pasującego przystanku.</div>';
        return;
    }
    box.innerHTML = filtered.map(s => `
        <div class="row-item" onclick='loadDepartures(${JSON.stringify(s.ids)}, ${JSON.stringify(s.name)})'>
            <div><strong>${s.name}</strong></div>
            <div style="font-size: 0.8rem; color: var(--info); font-weight: 600;">Rozkład &rarr;</div>
        </div>
    `).join('');
}

function timeToSeconds(timeStr) {
    if (!timeStr) return 0;
    const parts = timeStr.split(':').map(Number);
    return (parts[0] || 0) * 3600 + (parts[1] || 0) * 60 + (parts[2] || 0);
}

function formatDynamicCountdown(timeStr) {
    const now = new Date();
    const [h, m, s] = timeStr.split(':').map(Number);
    const target = new Date();
    target.setHours(h, m, s || 0, 0);

    let diffSec = Math.floor((target - now) / 1000);
    if (diffSec < -30) {
        target.setDate(target.getDate() + 1);
        diffSec = Math.floor((target - now) / 1000);
    }

    if (diffSec <= 0) return '<span class="moving-arrows">>>>></span>';
    if (diffSec < 60) return `za ${diffSec} s`;
    const mins = Math.ceil(diffSec / 60);
    return `za ${mins} min`;
}

function loadDepartures(stopIds, stopName, silent = false) {
    if (!silent) {
        switchTab('details');
        window.appState.currentViewType = 'stop';
        window.appState.currentViewParams = { stopIds, stopName };
        window.appState.currentStopName = stopName;
        const box = document.getElementById('details-content');
        box.innerHTML = `<div style="font-weight: 700; font-size: 1.1rem; margin-bottom: 4px;">${stopName}</div><div class="msg-box">Szukanie odjazdów w GTFS...</div>`;
    }

    const now = new Date();
    const currentSec = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
    let departures = [];

    stopIds.forEach(id => {
        const matchingTimes = window.appState.stopTimes.filter(st => st.stop_id === String(id));
        matchingTimes.forEach(st => {
            const trip = window.appState.tripsMap.get(st.trip_id);
            if (!trip) return;

            if (window.appState.activeServiceIds.size > 0 && !window.appState.activeServiceIds.has(trip.service_id)) {
                return;
            }

            const routeName = window.appState.routesMap.get(trip.route_id) || 'MZK';
            const arrTimeStr = st.arrival_time || st.departure_time;
            const arrSec = timeToSeconds(arrTimeStr);

            let vehicleData = window.appState.vehicles.find(v => 
                String(v.tripId || v.trip_id || v.trip) === String(st.trip_id)
            );

            let delayMinutes = null;
            let vehicleId = null;
            if (vehicleData && (vehicleData.delayInMinutes !== undefined || vehicleData.delay !== undefined)) {
                delayMinutes = parseInt(vehicleData.delayInMinutes !== undefined ? vehicleData.delayInMinutes : vehicleData.delay, 10);
                vehicleId = vehicleData.id || vehicleData.vehicleId;
            }

            if (arrSec >= currentSec - 300 && arrSec <= currentSec + 14400) {
                departures.push({
                    line: routeName,
                    headsign: trip.trip_headsign,
                    time: arrTimeStr.substring(0, 5),
                    fullTime: arrTimeStr,
                    delay: delayMinutes,
                    vehicleId: vehicleId,
                    sortSec: arrSec,
                    isPast: arrSec < currentSec
                });
            }
        });
    });

    departures.sort((a, b) => a.sortSec - b.sortSec);
    window.appState.currentDeps = departures;
    renderDeparturesList();
}

function renderDeparturesList(filterLine = 'all') {
    const box = document.getElementById('details-content');
    const stopName = window.appState.currentStopName;
    const deps = window.appState.currentDeps;

    if (!deps.length) {
        box.innerHTML = `<div style="font-weight: 700; font-size: 1.1rem; margin-bottom: 4px; border-bottom: 2px solid #000; padding-bottom: 6px;">${stopName}</div><div class="msg-box">Brak odjazdów dla tego przystanku.</div>`;
        return;
    }

    const uniqueLines = Array.from(new Set(deps.map(d => d.line))).sort((a, b) => String(a).localeCompare(String(b), undefined, { numeric: true }));
    const filtered = filterLine === 'all' ? deps : deps.filter(d => d.line === filterLine);

    // Zachowaj aktualnie wybrany filtr linii w selektorze jeśli istnieje
    const existingSelect = document.getElementById('line-filter-select');
    const currentSelectedFilter = existingSelect ? existingSelect.value : filterLine;

    box.innerHTML = `
        <div style="font-weight: 700; font-size: 1.1rem; margin-bottom: 8px; border-bottom: 2px solid #000; padding-bottom: 6px;">${stopName}</div>
        <div class="filter-bar">
            <span style="font-weight:600; font-size:0.85rem;">Filtruj linię:</span>
            <select id="line-filter-select" onchange="renderDeparturesList(this.value)">
                <option value="all" ${currentSelectedFilter === 'all' ? 'selected' : ''}>Wszystkie linie (${deps.length})</option>
                ${uniqueLines.map(l => `<option value="${l}" ${currentSelectedFilter === String(l) ? 'selected' : ''}>Linia ${l}</option>`).join('')}
            </select>
        </div>
        <div>
            ${filtered.map(d => {
                const countdownHtml = d.isPast ? 'Odjechał' : formatDynamicCountdown(d.fullTime || (d.time + ':00'));
                let statusHtml = '';
                
                if (d.delay !== null && !isNaN(d.delay)) {
                    if (d.delay > 0) {
                        statusHtml = `<div class="delay-info late">+${d.delay} min opóźnienia</div>`;
                    } else if (d.delay < 0) {
                        statusHtml = `<div class="delay-info on-time">${Math.abs(d.delay)} min przed czasem</div>`;
                    } else {
                        statusHtml = `<div class="delay-info on-time">Punktualnie (GPS)</div>`;
                    }
                } else {
                    statusHtml = `<div class="delay-info scheduled">Rozkład planowy</div>`;
                }

                return `
                    <div class="dep-row ${d.isPast ? 'past' : ''}">
                        <div style="display: flex; align-items: center; gap: 10px;">
                            <span class="badge" onclick="event.stopPropagation(); loadLineRoute('${d.line}', 'Linia ${d.line}')" title="Kliknij, aby przejść do linii">${d.line}</span>
                            <div>
                                <strong style="font-size: 0.95rem;">${d.headsign}</strong>
                                <div class="countdown-info">${d.isPast ? 'Odjechał' : countdownHtml}</div>
                            </div>
                        </div>
                        <div class="time-box">
                            <div class="time-main">${d.time}</div>
                            ${statusHtml}
                        </div>
                    </div>
                `;
            }).join('')}
        </div>
    `;
}

function renderLines() {
    const box = document.getElementById('lines-list');
    if (!window.appState.lines.length) {
        box.innerHTML = '<div class="msg-box">Brak linii w pliku routes.txt.</div>';
        return;
    }
    box.innerHTML = window.appState.lines.map(l => `
        <div class="row-item" onclick="loadLineRoute('${l.id}', '${l.name}')">
            <div style="display: flex; align-items: center; gap: 10px;">
                <span class="badge">${l.id}</span>
                <strong>${l.name}</strong>
            </div>
            <div style="font-size: 0.8rem; color: var(--info); font-weight: 600;">Wszystkie kursy &rarr;</div>
        </div>
    `).join('');
}

function loadLineRoute(lineId, lineName, silent = false) {
    if (!silent) {
        switchTab('details');
        window.appState.currentViewType = 'line';
        window.appState.currentViewParams = { lineId, lineName };
        const box = document.getElementById('details-content');
        box.innerHTML = `<div style="font-weight: 700; font-size: 1.1rem; margin-bottom: 4px;">${lineName}</div><div class="msg-box">Ładowanie pełnego rozkładu linii...</div>`;
    }

    const now = new Date();
    const currentSec = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
    
    const lineObj = window.appState.lines.find(l => String(l.id) === String(lineId));
    if (!lineObj) return;

    let lineTrips = [];
    window.appState.tripsMap.forEach((trip, tripId) => {
        if (String(trip.route_id) === String(lineObj.route_id)) {
            if (window.appState.activeServiceIds.size === 0 || window.appState.activeServiceIds.has(trip.service_id)) {
                lineTrips.push({ tripId, ...trip });
            }
        }
    });

    let allLineDepartures = [];
    lineTrips.forEach(trip => {
        const stList = window.appState.stopTimes.filter(st => String(st.trip_id) === String(trip.tripId));
        if (!stList.length) return;
        
        stList.sort((a, b) => parseInt(a.stop_sequence || 0, 10) - parseInt(b.stop_sequence || 0, 10));
        const firstStop = stList[0];
        const lastStop = stList[stList.length - 1];

        const startStopName = window.appState.stopsMap.get(firstStop.stop_id) || 'Początek trasy';
        const timeStr = firstStop.departure_time || firstStop.arrival_time;
        const timeSec = timeToSeconds(timeStr);
        const endSec = timeToSeconds(lastStop.arrival_time || lastStop.departure_time);

        let vehicleData = window.appState.vehicles.find(v => 
            String(v.tripId || v.trip_id || v.trip) === String(trip.tripId)
        );
        let delayMinutes = vehicleData ? parseInt(vehicleData.delayInMinutes !== undefined ? vehicleData.delayInMinutes : (vehicleData.delay || 0), 10) : null;

        const isCurrentlyActive = (currentSec >= timeSec && currentSec <= endSec) || (vehicleData !== undefined);

        allLineDepartures.push({
            tripId: trip.tripId,
            time: timeStr.substring(0, 5),
            sortSec: timeSec,
            endSec: endSec,
            headsign: trip.trip_headsign,
            startStop: cleanStopName(startStopName),
            delay: delayMinutes,
            isPast: timeSec < currentSec && !isCurrentlyActive,
            isActive: isCurrentlyActive,
            vehicleData: vehicleData
        });
    });

    allLineDepartures.sort((a, b) => a.sortSec - b.sortSec);

    const box = document.getElementById('details-content');
    box.innerHTML = `
        <div style="font-weight: 700; font-size: 1.1rem; margin-bottom: 4px; border-bottom: 2px solid #000; padding-bottom: 6px;">${lineName} – Wszystkie dzisiejsze kursy</div>
        <div style="font-size: 0.85rem; color: var(--gray-text); margin-bottom: 12px;">Aktualnie odbywane kursy zaznaczone są na <strong style="color:var(--success);">zielono</strong>. Kliknij kurs, aby zobaczyć szczegóły na przystankach.</div>
        <div>
            ${allLineDepartures.length ? allLineDepartures.map(d => {
                let locationDesc = '';
                if (d.isActive && d.vehicleData) {
                    const gpsInfo = getVehicleNextStopInfo(d.vehicleData);
                    locationDesc = `<div style="font-size: 0.8rem; color: var(--success); font-weight: 700; margin-top: 2px;">Aktualnie: ${gpsInfo.segment}</div>`;
                } else if (d.isActive) {
                    locationDesc = `<div style="font-size: 0.8rem; color: var(--success); font-weight: 700; margin-top: 2px;">Kurs w trakcie realizacji</div>`;
                } else {
                    locationDesc = `<div style="font-size: 0.8rem; color: var(--gray-text); margin-top: 2px;">Start z: <strong>${d.startStop}</strong></div>`;
                }

                return `
                    <div class="dep-row ${d.isActive ? 'active-trip' : (d.isPast ? 'past' : '')}" onclick="loadTripStops('${d.tripId}', '${lineId}', '${d.headsign}')">
                        <div style="display: flex; align-items: center; gap: 10px;">
                            <span class="badge">${lineId}</span>
                            <div>
                                <strong style="font-size: 0.95rem;">Kierunek: ${d.headsign}</strong>
                                ${locationDesc}
                            </div>
                        </div>
                        <div class="time-box">
                            <div class="time-main">${d.time}</div>
                            ${d.delay !== null && !isNaN(d.delay) && d.delay !== 0 ? `
                                <div class="delay-info ${d.delay > 0 ? 'late' : 'on-time'}">${d.delay > 0 ? `+${d.delay} min` : `${Math.abs(d.delay)} min przed`}</div>
                            ` : `<div class="delay-info scheduled">${d.isActive ? 'Na trasie' : (d.isPast ? 'Odbyty' : 'Wg rozkładu')}</div>`}
                        </div>
                    </div>
                `;
            }).join('') : '<div class="msg-box">Brak rozkładu jazdy dla tej linii na dzisiejszy dzień.</div>'}
        </div>
    `;
}

function loadTripStops(tripId, lineId, headsign, silent = false) {
    if (!silent) {
        switchTab('details');
        window.appState.currentViewType = 'trip';
        window.appState.currentViewParams = { tripId, lineId, headsign };
        const box = document.getElementById('details-content');
        box.innerHTML = `<div style="font-weight: 700; font-size: 1.1rem; margin-bottom: 4px;">Linia ${lineId} &rarr; ${headsign}</div><div class="msg-box">Ładowanie pełnej trasy kursu ze wszystkich przystanków...</div>`;
    }

    const now = new Date();
    const currentSec = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();

    let tripStops = window.appState.stopTimes.filter(st => String(st.trip_id) === String(tripId));
    tripStops.sort((a, b) => parseInt(a.stop_sequence || 0, 10) - parseInt(b.stop_sequence || 0, 10));

    if (!tripStops.length) return;

    let vehicleData = window.appState.vehicles.find(v => 
        String(v.tripId || v.trip_id || v.trip) === String(tripId)
    );
    let delayMinutes = vehicleData ? parseInt(vehicleData.delayInMinutes !== undefined ? vehicleData.delayInMinutes : (vehicleData.delay || 0), 10) : 0;

    let stopsHtml = tripStops.map((st, index) => {
        const stopName = window.appState.stopsMap.get(st.stop_id) || `Przystanek #${st.stop_id}`;
        const timeStr = st.arrival_time || st.departure_time || '';
        const timeSec = timeToSeconds(timeStr);
        const adjustedSec = timeSec + (delayMinutes * 60);
        const isPast = adjustedSec < currentSec;

        return `
            <div class="dep-row ${isPast ? 'past' : ''}" style="cursor: default;">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <span style="font-weight: 700; color: var(--gray-text); font-size: 0.85rem; min-width: 24px;">${index + 1}.</span>
                    <div>
                        <strong style="font-size: 0.95rem;">${cleanStopName(stopName)}</strong>
                        <div style="font-size: 0.75rem; color: var(--gray-text);">Przystanek na trasie kursu</div>
                    </div>
                </div>
                <div class="time-box">
                    <div class="time-main">${timeStr.substring(0, 5)}</div>
                    ${delayMinutes !== 0 && !isNaN(delayMinutes) ? `
                        <div class="delay-info ${delayMinutes > 0 ? 'late' : 'on-time'}">${delayMinutes > 0 ? `+${delayMinutes} min` : `${Math.abs(delayMinutes)} min przed`}</div>
                    ` : `<div class="delay-info scheduled">Rozkład planowy</div>`}
                </div>
            </div>
        `;
    }).join('');

    const box = document.getElementById('details-content');
    box.innerHTML = `
        <div style="font-weight: 700; font-size: 1.1rem; margin-bottom: 4px; border-bottom: 2px solid #000; padding-bottom: 6px;">Linia ${lineId} – Przebieg kursu</div>
        <div style="font-size: 0.85rem; color: var(--gray-text); margin-bottom: 12px;">Kierunek: <strong>${headsign}</strong> ${vehicleData ? `<span style="color:var(--success); font-weight:600;">(Pojazd aktywny GPS, opóźnienie: ${delayMinutes > 0 ? '+' + delayMinutes : delayMinutes} min)</span>` : ''}</div>
        <div>${stopsHtml}</div>
    `;
}

function renderLive() {
    const box = document.getElementById('live-list');
    if (!window.appState.vehicles.length) {
        box.innerHTML = '<div class="msg-box">Brak danych GPS dla pojazdów.</div>';
        return;
    }
    box.innerHTML = window.appState.vehicles.map(v => {
        const line = v.lineLabel || v.line || v.routeShortName || v.routeName || '?';
        const delay = parseInt(v.delayInMinutes !== undefined ? v.delayInMinutes : (v.delay || 0), 10);
        
        const nextInfo = getVehicleNextStopInfo(v);

        return `
            <div class="dep-row" onclick="loadLineRoute('${line}', 'Linia ${line}')">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <span class="badge">${line}</span>
                    <div>
                        <strong style="font-size: 0.95rem;">Linia ${line}</strong>
                        <div style="font-size: 0.85rem; color: var(--success); font-weight: 600; margin-top: 3px;">📍 ${nextInfo.segment}</div>
                        <div style="font-size: 0.8rem; color: var(--info); font-weight: 600; margin-top: 1px;">Przewidywany przyjazd: <strong>${nextInfo.text}</strong></div>
                        <div style="font-size: 0.75rem; color: var(--gray-text); margin-top: 1px;">Pojazd ID #${v.id || v.vehicleId || 'N/A'} (Kliknij, aby przejść do linii)</div>
                    </div>
                </div>
                <div class="time-box">
                    ${delay > 0 ? `<div class="delay-info late">+${delay} min</div>` : (delay < 0 ? `<div class="delay-info on-time">${Math.abs(delay)} min przed</div>` : `<div class="delay-info on-time">Punktualnie</div>`)}
                </div>
            </div>
        `;
    }).join('');
}

document.addEventListener('DOMContentLoaded', initApp);
</script>
</body>
</html>
