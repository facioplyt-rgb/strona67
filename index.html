
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MZK Gorzów Wlkp. – GTFS & Live API</title>
    <style>
        :root {
            --bg: #ffffff;
            --text: #1a1a1a;
            --gray-light: #f4f5f7;
            --gray-border: #d0d7de;
            --gray-dark: #24292e;
            --danger: #cf222e;
            --success: #1a7f37;
            --info: #0969da;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.45; }

        header {
            background: var(--gray-dark);
            color: #fff;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #000;
        }

        .logo-title { font-weight: 700; font-size: 1.05rem; letter-spacing: 0.5px; text-transform: uppercase; }
        .clock { font-size: 0.95rem; font-weight: 600; font-variant-numeric: tabular-nums; }

        nav {
            display: flex;
            background: var(--gray-light);
            border-bottom: 1px solid var(--gray-border);
        }

        .nav-btn {
            flex: 1;
            background: none;
            border: none;
            border-right: 1px solid var(--gray-border);
            padding: 12px 8px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            text-align: center;
            color: var(--gray-dark);
            transition: background 0.15s;
        }
        .nav-btn:last-child { border-right: none; }
        .nav-btn.active { background: #fff; color: #000; border-bottom: 3px solid var(--gray-dark); }

        .container { max-width: 800px; margin: 0 auto; padding: 16px; }
        .section { display: none; }
        .section.active { display: block; }

        input[type="text"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--gray-border);
            border-radius: 6px;
            font-size: 0.95rem;
            margin-bottom: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus { border-color: var(--info); box-shadow: 0 0 0 3px rgba(9,105,218,0.15); }

        .row-item {
            padding: 12px;
            border-bottom: 1px solid #e1e4e8;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: background 0.1s;
        }
        .row-item:hover { background: var(--gray-light); }

        .badge {
            display: inline-block;
            border: 2px solid var(--gray-dark);
            border-radius: 6px;
            padding: 4px 8px;
            font-weight: 700;
            font-size: 0.85rem;
            min-width: 40px;
            text-align: center;
            background: #fff;
            color: var(--gray-dark);
        }

        .back-btn {
            background: var(--gray-light);
            border: 1px solid var(--gray-border);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            margin-bottom: 14px;
            font-size: 0.85rem;
        }
        .back-btn:hover { background: #eaeef2; }

        .dep-row {
            padding: 12px;
            border-bottom: 1px solid #e1e4e8;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .time-box { text-align: right; }
        .time-main { font-weight: 700; font-size: 1.1rem; font-variant-numeric: tabular-nums; }
        .countdown-info { font-size: 0.75rem; font-weight: 600; color: var(--info); }
        .delay-info { font-size: 0.75rem; font-weight: 700; margin-top: 2px; }
        .delay-info.late { color: var(--danger); }
        .delay-info.on-time { color: var(--success); }
        .delay-info.scheduled { color: #57606a; font-weight: 500; }

        .filter-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
            align-items: center;
            flex-wrap: wrap;
        }
        .filter-bar select {
            padding: 6px 10px;
            border: 1px solid var(--gray-border);
            border-radius: 6px;
            background: #fff;
            font-size: 0.9rem;
            outline: none;
        }

        .status-bar {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: var(--gray-dark);
            color: #fff;
            padding: 6px 16px;
            font-size: 0.75rem;
            display: flex;
            justify-content: space-between;
            z-index: 100;
        }
        
        .msg-box { text-align: center; padding: 30px; color: #57606a; font-weight: 500; }
    </style>
</head>
<body>

<header>
    <div class="logo-title">MZK Gorzów Wlkp. – GTFS & Live API</div>
    <div class="clock" id="clock">--:--:--</div>
</header>

<nav>
    <button class="nav-btn active" onclick="switchTab('stops')">Przystanki</button>
    <button class="nav-btn" onclick="switchTab('lines')">Linie</button>
    <button class="nav-btn" onclick="switchTab('live')">GPS Na Żywo</button>
</nav>

<div class="container" style="padding-bottom: 50px;">
    <!-- PRZYSTANKI -->
    <section id="sec-stops" class="section active">
        <input type="text" id="stop-search" placeholder="Szukaj konkretnego przystanku..." oninput="filterStops(this.value)">
        <div id="stops-list" class="msg-box">Wczytywanie bazy przystanków GTFS...</div>
    </section>

    <!-- LINIE -->
    <section id="sec-lines" class="section">
        <div id="lines-list" class="msg-box">Wczytywanie linii z GTFS...</div>
    </section>

    <!-- POJAZDY GPS -->
    <section id="sec-live" class="section">
        <div id="live-list" class="msg-box">Pobieranie pozycji pojazdów z API...</div>
    </section>

    <!-- SZCZEGÓŁY ODJAZDÓW -->
    <section id="sec-details" class="section">
        <button class="back-btn" onclick="switchTab(window.appState.lastTab || 'stops')">&larr; Powrót</button>
        <div id="details-content"></div>
    </section>
</div>

<div class="status-bar">
    <span id="status-text">Inicjalizacja systemu...</span>
    <span id="api-status">GTFS Professional Engine</span>
</div>

<script>
const PROXY_URL = "https://shiny-tree-3a9b.fabianzukowski-32.workers.dev/"; 
const TOKEN = "iwa_live_tlv2api_b065655533f6d1b185f5d916ea359a8cd6cf7c545b7c54ae1B9Wj9";

window.appState = {
    stopsMap: new Map(),         // stop_id -> stop_name
    routesMap: new Map(),        // route_id -> route_short_name
    tripsMap: new Map(),         // trip_id -> { route_id, trip_headsign, service_id }
    stopTimes: [],               // tablica obiektów z stop_times.txt
    activeServiceIds: new Set(), // service_id aktywne dzisiaj
    vehicles: [],                // pojazdy z API na żywo
    stops: [],                   // zagregowane unikalne przystanki
    lines: [],                   // unikalne linie
    lastTab: 'stops',
    currentDeps: [],
    currentStopName: ''
};

function parseCSV(text) {
    const lines = text.replace(/\r/g, '').split('\n');
    if (lines.length < 2) return [];
    
    const parseLine = (line) => {
        const result = [];
        let inQuotes = false;
        let entry = '';
        for (let i = 0; i < line.length; i++) {
            const char = line[i];
            if (char === '"') {
                inQuotes = !inQuotes;
            } else if (char === ',' && !inQuotes) {
                result.push(entry.trim());
                entry = '';
            } else {
                entry += char;
            }
        }
        result.push(entry.trim());
        return result;
    };

    const headers = parseLine(lines[0]);
    const data = [];

    for (let i = 1; i < lines.length; i++) {
        if (!lines[i].trim()) continue;
        const currentLine = parseLine(lines[i]);
        const obj = {};
        for (let j = 0; j < headers.length; j++) {
            obj[headers[j]] = currentLine[j] !== undefined ? currentLine[j].replace(/^"|"$/g, '') : '';
        }
        data.push(obj);
    }
    return data;
}

async function loadStaticGTFS() {
    try {
        const [stopsRes, routesRes, tripsRes, stopTimesRes, calendarRes, calendarDatesRes] = await Promise.all([
            fetch('./stops.txt').catch(() => null),
            fetch('./routes.txt').catch(() => null),
            fetch('./trips.txt').catch(() => null),
            fetch('./stop_times.txt').catch(() => null),
            fetch('./calendar.txt').catch(() => null),
            fetch('./calendar_dates.txt').catch(() => null)
        ]);

        if (stopsRes && stopsRes.ok) {
            parseCSV(await stopsRes.text()).forEach(r => {
                if (r.stop_id && r.stop_name) window.appState.stopsMap.set(r.stop_id, r.stop_name);
            });
        }

        if (routesRes && routesRes.ok) {
            parseCSV(await routesRes.text()).forEach(r => {
                if (r.route_id) {
                    window.appState.routesMap.set(r.route_id, r.route_short_name || r.route_long_name || r.route_id);
                }
            });
        }

        const now = new Date();
        const days = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'];
        const todayDayName = days[now.getDay()];
        const yyyy = now.getFullYear();
        const mm = String(now.getMonth() + 1).padStart(2, '0');
        const dd = String(now.getDate()).padStart(2, '0');
        const todayDateStr = `${yyyy}${mm}${dd}`;

        let serviceIds = new Set();
        if (calendarRes && calendarRes.ok) {
            parseCSV(await calendarRes.text()).forEach(c => {
                if (todayDateStr >= c.start_date && todayDateStr <= c.end_date) {
                    if (c[todayDayName] === '1') serviceIds.add(c.service_id);
                }
            });
        }
        if (calendarDatesRes && calendarDatesRes.ok) {
            parseCSV(await calendarDatesRes.text()).forEach(cd => {
                if (cd.date === todayDateStr) {
                    if (cd.exception_type === '1') serviceIds.add(cd.service_id);
                    if (cd.exception_type === '2') serviceIds.delete(cd.service_id);
                }
            });
        }
        if (serviceIds.size === 0 && calendarRes) {
            parseCSV(await calendarRes.text()).forEach(c => serviceIds.add(c.service_id));
        }
        window.appState.activeServiceIds = serviceIds;

        if (stopTimesRes && stopTimesRes.ok) {
            window.appState.stopTimes = parseCSV(await stopTimesRes.text());
        }

        const tripLastStopMap = new Map();
        const tripMaxSeq = new Map();

        window.appState.stopTimes.forEach(st => {
            const seq = parseInt(st.stop_sequence || 0, 10);
            const currentMax = tripMaxSeq.get(st.trip_id) || -1;
            if (seq >= currentMax) {
                tripMaxSeq.set(st.trip_id, seq);
                tripLastStopMap.set(st.trip_id, st.stop_id);
            }
        });

        if (tripsRes && tripsRes.ok) {
            parseCSV(await tripsRes.text()).forEach(t => {
                if (t.trip_id) {
                    let headsign = t.trip_headsign;
                    if (!headsign || headsign.trim() === '') {
                        const lastStopId = tripLastStopMap.get(t.trip_id);
                        headsign = lastStopId ? window.appState.stopsMap.get(lastStopId) : 'Kierunek końcowy';
                    }
                    window.appState.tripsMap.set(t.trip_id, {
                        route_id: t.route_id,
                        trip_headsign: cleanStopName(headsign),
                        service_id: t.service_id
                    });
                }
            });
        }

        return true;
    } catch (e) {
        console.error("Błąd ładowania GTFS:", e);
        return false;
    }
}

function cleanStopName(name) {
    if (!name) return '';
    return name.replace(/\s*\(\d+\)\s*$/, '').trim();
}

async function fetchAPI(command, action, params = '') {
    const targetUrl = `https://komunikacja.um.gorzow.pl/vm/main?command=${command}&action=${action}&token=${TOKEN}${params}`;
    try {
        const res = await fetch(PROXY_URL + "?url=" + encodeURIComponent(targetUrl));
        if (!res.ok) return null;
        const text = await res.text();
        if (!text || text.trim().startsWith('<') || text.includes('Cloudflare')) return null;
        return JSON.parse(text);
    } catch (e) {
        console.error("Błąd API:", e);
        return null;
    }
}

async function initApp() {
    startClock();
    document.getElementById('status-text').innerText = 'Ładowanie rozkładu GTFS...';
    
    await loadStaticGTFS();

    const groupedStops = new Map();
    window.appState.stopsMap.forEach((stopName, stopId) => {
        let cleanName = cleanStopName(stopName);
        if (!groupedStops.has(cleanName)) {
            groupedStops.set(cleanName, { name: cleanName, ids: [] });
        }
        groupedStops.get(cleanName).ids.push(stopId);
    });

    window.appState.stops = Array.from(groupedStops.values()).sort((a, b) => a.name.localeCompare(b.name));

    const linesMap = new Map();
    window.appState.routesMap.forEach((rName) => {
        linesMap.set(rName, { id: rName, name: `Linia ${rName}` });
    });
    window.appState.lines = Array.from(linesMap.values()).sort((a, b) => String(a.id).localeCompare(String(b.id), undefined, { numeric: true }));

    renderStops();
    renderLines();

    document.getElementById('status-text').innerText = 'Pobieranie pozycji GPS z API...';
    const vehiclesData = await fetchAPI('planner', 'v');
    window.appState.vehicles = Array.isArray(vehiclesData) ? vehiclesData : (vehiclesData?.vehicles || vehiclesData?.data || []);

    renderLive();
    document.getElementById('status-text').innerText = 'Gotowy – GTFS + Live API';
}

function startClock() {
    setInterval(() => {
        document.getElementById('clock').innerText = new Date().toLocaleTimeString('pl-PL');
    }, 1000);
}

function switchTab(tab) {
    if (tab !== 'details') window.appState.lastTab = tab;
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    
    const targetSec = document.getElementById(`sec-${tab}`);
    if (targetSec) targetSec.classList.add('active');

    if (tab !== 'details') {
        const btn = Array.from(document.querySelectorAll('.nav-btn')).find(b => b.getAttribute('onclick').includes(tab));
        if (btn) btn.classList.add('active');
    }
}

function renderStops() { filterStops(''); }

function filterStops(query) {
    const box = document.getElementById('stops-list');
    if (!window.appState.stops.length) {
        box.innerHTML = '<div class="msg-box">Brak przystanków w pliku stops.txt.</div>';
        return;
    }
    const filtered = window.appState.stops.filter(s => s.name.toLowerCase().includes(query.toLowerCase()));
    if (!filtered.length) {
        box.innerHTML = '<div class="msg-box">Nie znaleziono pasującego przystanku.</div>';
        return;
    }
    box.innerHTML = filtered.map(s => `
        <div class="row-item" onclick='loadDepartures(${JSON.stringify(s.ids)}, ${JSON.stringify(s.name)})'>
            <div><strong>${s.name}</strong></div>
            <div style="font-size: 0.8rem; color: var(--info); font-weight: 600;">Rozkład &rarr;</div>
        </div>
    `).join('');
}

function timeToSeconds(timeStr) {
    if (!timeStr) return 0;
    const parts = timeStr.split(':').map(Number);
    return (parts[0] || 0) * 3600 + (parts[1] || 0) * 60 + (parts[2] || 0);
}

function loadDepartures(stopIds, stopName) {
    switchTab('details');
    window.appState.currentStopName = stopName;
    const box = document.getElementById('details-content');
    box.innerHTML = `<div style="font-weight: 700; font-size: 1.1rem; margin-bottom: 4px;">${stopName}</div><div class="msg-box">Szukanie odjazdów w GTFS...</div>`;

    const now = new Date();
    const currentSec = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
    let departures = [];

    stopIds.forEach(id => {
        const matchingTimes = window.appState.stopTimes.filter(st => st.stop_id === String(id));
        matchingTimes.forEach(st => {
            const trip = window.appState.tripsMap.get(st.trip_id);
            if (!trip) return;

            if (window.appState.activeServiceIds.size > 0 && !window.appState.activeServiceIds.has(trip.service_id)) {
                return;
            }

            const routeName = window.appState.routesMap.get(trip.route_id) || 'MZK';
            const arrTimeStr = st.arrival_time || st.departure_time;
            const arrSec = timeToSeconds(arrTimeStr);

            let vehicleData = null;
            const matchedVehicle = window.appState.vehicles.find(v => 
                String(v.tripId || v.trip_id || v.trip) === String(st.trip_id)
            );

            if (matchedVehicle) {
                vehicleData = matchedVehicle;
            }

            let delayMinutes = null;
            let vehicleId = null;
            if (vehicleData && (vehicleData.delayInMinutes !== undefined || vehicleData.delay !== undefined)) {
                delayMinutes = parseInt(vehicleData.delayInMinutes !== undefined ? vehicleData.delayInMinutes : vehicleData.delay, 10);
                vehicleId = vehicleData.id || vehicleData.vehicleId;
            }

            if (arrSec >= currentSec - 180 && arrSec <= currentSec + 14400) {
                departures.push({
                    line: routeName,
                    headsign: trip.trip_headsign,
                    time: arrTimeStr.substring(0, 5),
                    delay: delayMinutes,
                    vehicleId: vehicleId,
                    sortSec: arrSec
                });
            }
        });
    });

    if (departures.length === 0 && window.appState.stopTimes.length > 0) {
        stopIds.forEach(id => {
            window.appState.stopTimes.filter(st => st.stop_id === String(id)).slice(0, 30).forEach(st => {
                const trip = window.appState.tripsMap.get(st.trip_id);
                if (!trip) return;
                const routeName = window.appState.routesMap.get(trip.route_id) || 'MZK';
                const arrTimeStr = st.arrival_time || st.departure_time;
                const arrSec = timeToSeconds(arrTimeStr);

                departures.push({
                    line: routeName,
                    headsign: trip.trip_headsign,
                    time: arrTimeStr.substring(0, 5),
                    delay: null,
                    vehicleId: null,
                    sortSec: arrSec
                });
            });
        });
    }

    departures.sort((a, b) => a.sortSec - b.sortSec);
    window.appState.currentDeps = departures;
    renderDeparturesList();
}

function renderDeparturesList(filterLine = 'all') {
    const box = document.getElementById('details-content');
    const stopName = window.appState.currentStopName;
    const deps = window.appState.currentDeps;

    if (!deps.length) {
        box.innerHTML = `<div style="font-weight: 700; font-size: 1.1rem; margin-bottom: 4px; border-bottom: 2px solid #000; padding-bottom: 6px;">${stopName}</div><div class="msg-box">Brak odjazdów dla tego przystanku.</div>`;
        return;
    }

    const uniqueLines = Array.from(new Set(deps.map(d => d.line))).sort((a, b) => String(a).localeCompare(String(b), undefined, { numeric: true }));
    const filtered = filterLine === 'all' ? deps : deps.filter(d => d.line === filterLine);

    box.innerHTML = `
        <div style="font-weight: 700; font-size: 1.1rem; margin-bottom: 8px; border-bottom: 2px solid #000; padding-bottom: 6px;">${stopName}</div>
        <div class="filter-bar">
            <span style="font-weight:600; font-size:0.85rem;">Filtruj linię:</span>
            <select onchange="renderDeparturesList(this.value)">
                <option value="all" ${filterLine === 'all' ? 'selected' : ''}>Wszystkie linie (${deps.length})</option>
                ${uniqueLines.map(l => `<option value="${l}" ${filterLine === String(l) ? 'selected' : ''}>Linia ${l}</option>`).join('')}
            </select>
        </div>
        <div>
            ${filtered.map(d => {
                const timeInfo = getCountdown(d.time);
                let statusHtml = '';
                
                if (d.delay !== null && !isNaN(d.delay)) {
                    if (d.delay > 0) {
                        statusHtml = `<div class="delay-info late">+${d.delay} min opóźnienia${d.vehicleId ? ' (GPS)' : ''}</div>`;
                    } else if (d.delay < 0) {
                        statusHtml = `<div class="delay-info on-time">${Math.abs(d.delay)} min przed czasem${d.vehicleId ? ' (GPS)' : ''}</div>`;
                    } else {
                        statusHtml = `<div class="delay-info on-time">Punktualnie (GPS)</div>`;
                    }
                } else {
                    statusHtml = `<div class="delay-info scheduled">Rozkład planowy GTFS</div>`;
                }

                return `
                    <div class="dep-row">
                        <div style="display: flex; align-items: center; gap: 10px;">
                            <span class="badge">${d.line}</span>
                            <div>
                                <strong style="font-size: 0.95rem;">${d.headsign}</strong>
                                <div class="countdown-info">za ${timeInfo}</div>
                            </div>
                        </div>
                        <div class="time-box">
                            <div class="time-main">${d.time}</div>
                            ${statusHtml}
                        </div>
                    </div>
                `;
            }).join('')}
        </div>
    `;
}

function getCountdown(timeStr) {
    const now = new Date();
    const [h, m] = timeStr.split(':').map(Number);
    const target = new Date();
    target.setHours(h, m, 0, 0);

    let diffSec = Math.floor((target - now) / 1000);
    if (diffSec < -30) {
        target.setDate(target.getDate() + 1);
        diffSec = Math.floor((target - now) / 1000);
    }

    if (diffSec < 0) return 'odjeżdża';
    const mins = Math.floor(diffSec / 60);
    const secs = diffSec % 60;
    if (mins === 0) return `${secs} s`;
    return `${mins} min ${secs} s`;
}

function renderLines() {
    const box = document.getElementById('lines-list');
    if (!window.appState.lines.length) {
        box.innerHTML = '<div class="msg-box">Brak linii w pliku routes.txt.</div>';
        return;
    }
    box.innerHTML = window.appState.lines.map(l => `
        <div class="row-item" onclick="loadLineRoute('${l.id}', '${l.name}')">
            <div style="display: flex; align-items: center; gap: 10px;">
                <span class="badge">${l.id}</span>
                <strong>${l.name}</strong>
            </div>
            <div style="font-size: 0.8rem; color: var(--info); font-weight: 600;">Pojazdy GPS &rarr;</div>
        </div>
    `).join('');
}

function loadLineRoute(lineId, lineName) {
    switchTab('details');
    const box = document.getElementById('details-content');
    const activeVehicles = window.appState.vehicles.filter(v => {
        const vLine = String(v.lineLabel || v.line || v.routeShortName || v.routeName || '');
        return vLine === String(lineId);
    });

    box.innerHTML = `
        <div style="font-weight: 700; font-size: 1.1rem; margin-bottom: 8px; border-bottom: 2px solid #000; padding-bottom: 6px;">${lineName}</div>
        <div style="font-size: 0.85rem; color: #57606a; margin-bottom: 10px;">Aktywne pojazdy na trasie (dane z API na żywo):</div>
        <div>
            ${activeVehicles.length ? activeVehicles.map(v => {
                let tripId = v.tripId || v.trip_id || v.trip;
                let headsign = v.headsign || v.direction || v.destination || v.routeDestination || (tripId && window.appState.tripsMap.has(tripId) ? window.appState.tripsMap.get(tripId).trip_headsign : null) || 'Kierunek końcowy';
                let nextStop = v.nextStopName || v.nextStop || v.stopName || v.currentStop || v.lastStop || 'Brak danych o przystanku';
                let delay = parseInt(v.delayInMinutes !== undefined ? v.delayInMinutes : (v.delay || 0), 10);
                return `
                    <div class="dep-row">
                        <div>
                            <strong>Pojazd ID #${v.id || v.vehicleId || 'N/A'}</strong>
                            <div style="font-size: 0.85rem; margin-top: 2px;">Kierunek: <strong>${headsign}</strong></div>
                            <div style="font-size: 0.8rem; color: #57606a; margin-top: 2px;">Najbliższy przystanek: <strong>${nextStop}</strong></div>
                        </div>
                        <div class="time-box">
                            ${delay > 0 ? `<div class="delay-info late">+${delay} min opóźnienia</div>` : (delay < 0 ? `<div class="delay-info on-time">${Math.abs(delay)} min przed czasem</div>` : `<div class="delay-info on-time">Punktualnie</div>`)}
                        </div>
                    </div>
                `;
            }).join('') : '<div class="msg-box">Brak aktywnych pojazdów na tej linii w bazie API.</div>'}
        </div>
    `;
}

function renderLive() {
    const box = document.getElementById('live-list');
    if (!window.appState.vehicles.length) {
        box.innerHTML = '<div class="msg-box">Brak danych GPS dla pojazdów.</div>';
        return;
    }
    box.innerHTML = window.appState.vehicles.map(v => {
        const line = v.lineLabel || v.line || v.routeShortName || v.routeName || '?';
        let tripId = v.tripId || v.trip_id || v.trip;
        
        // Rozszerzone pobieranie kierunku z API na żywo lub fallback do bazy GTFS trips.txt
        let headsign = v.headsign || v.direction || v.destination || v.routeDestination || (tripId && window.appState.tripsMap.has(tripId) ? window.appState.tripsMap.get(tripId).trip_headsign : null) || 'Kierunek miejski';
        
        // Rozszerzone pobieranie najbliższego przystanku z API na żywo
        let nextStop = v.nextStopName || v.nextStop || v.stopName || v.currentStop || v.lastStop || 'Brak danych';
        
        const delay = parseInt(v.delayInMinutes !== undefined ? v.delayInMinutes : (v.delay || 0), 10);

        return `
            <div class="dep-row">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <span class="badge">${line}</span>
                    <div>
                        <strong style="font-size: 0.95rem;">Kierunek: ${headsign}</strong>
                        <div style="font-size: 0.8rem; color: #57606a; margin-top: 2px;">Najbliższy przystanek: <strong>${nextStop}</strong></div>
                        <div style="font-size: 0.75rem; color: #8c959f; margin-top: 1px;">Pojazd ID #${v.id || v.vehicleId || 'N/A'}</div>
                    </div>
                </div>
                <div class="time-box">
                    ${delay > 0 ? `<div class="delay-info late">+${delay} min</div>` : (delay < 0 ? `<div class="delay-info on-time">${Math.abs(delay)} min przed</div>` : `<div class="delay-info on-time">Punktualnie</div>`)}
                </div>
            </div>
        `;
    }).join('');
}

document.addEventListener('DOMContentLoaded', initApp);
</script>
</body>
</html>
